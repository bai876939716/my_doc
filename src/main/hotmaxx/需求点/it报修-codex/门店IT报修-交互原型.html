*{box-sizing:border-box}body{margin:0;background:#f2f1ed;color:#262821;font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{border:0;cursor:pointer;background:white}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ce692c;outline-offset:2px}button:hover{filter:brightness(.96)}h1,h2,h3,p{margin:0}small,.muted{color:#646860}small{font-size:12px}header.top{height:62px;border-bottom:1px solid #d5d6cd;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:#fbfaf6}.brand{font-weight:900;letter-spacing:-1px;font-size:22px}.brand i{color:#cf471f;font-style:normal}header.top span{font-size:12px;color:#686c63}.layout{display:grid;grid-template-columns:minmax(205px,260px) minmax(338px,396px) minmax(265px,350px);gap:clamp(20px,3vw,54px);max-width:1240px;margin:34px auto;padding:0 22px;align-items:start}.intro{padding-top:21px}.kicker,.serial{font:700 11px/1.5 ui-monospace,monospace;letter-spacing:1.4px;color:#8a4a2a}.intro h1{font-size:clamp(34px,3.4vw,52px);letter-spacing:-3px;line-height:1.18;margin:14px 0 18px}.intro>p{max-width:240px;color:#56594f}.divider{border-top:1px solid #d2d4c9;margin:27px 0 16px}.cases{display:grid;gap:8px;margin-top:12px}.case{display:flex;align-items:center;justify-content:space-between;text-align:left;border:1px solid #d2d4c9;border-radius:9px;padding:12px;background:#faf9f5}.case b,.case small{display:block}.case i{font-size:18px;font-style:normal;color:#b15c32}.phone{background:#faf9f7;border:5px solid #302f2c;border-radius:32px;overflow:hidden;box-shadow:0 16px 36px #32352b16;height:min(798px,calc(100dvh - 116px));min-height:600px;display:flex;flex-direction:column}.status{padding:7px 18px 1px;background:white;font:bold 11px/1.4 ui-monospace,monospace;display:flex;justify-content:space-between}.nav{display:flex;align-items:center;justify-content:space-between;background:white;padding:5px 12px 10px;border-bottom:1px solid #e8e6df}.nav button{width:30px;border-radius:8px;font-size:19px}.nav strong{font-size:16px}.screen{flex:1;overflow:auto;min-height:0;padding:15px}.foot{background:white;border-top:1px solid #e8e6df;padding:10px 14px;display:grid;gap:8px}.foot:empty{display:none}.primary,.secondary,.chip{font-weight:650;border-radius:9px;padding:9px 12px}.primary{background:#c24c24;color:white}.secondary,.chip{background:#fff;border:1px solid #d9d9cf}.chip{font-size:12px;padding:6px 10px}.chips,.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.row{justify-content:space-between}.card,.hero,.desk{border:1px solid #dedfd7;background:white;border-radius:14px;padding:15px;margin-bottom:12px}.hero{background:#fbe9da;border-color:#f0ccb3}.hero h2{font-size:23px;margin:4px 0}.icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#cb532b;color:white;font-size:21px}.go{display:flex;align-items:center;gap:10px;text-align:left;width:100%}.go strong{display:block;font-size:17px}.go em{margin-left:auto;font-size:20px;color:#976144}.card h3,.desk h3{font-size:16px;margin-bottom:8px}.screen label,.desk label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}.input,select,textarea{padding:9px;width:100%;border:1px solid #d8dad2;background:#fff;border-radius:7px}textarea{resize:vertical;min-height:64px}.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #efefe9}.meta span{color:#71756a;font-size:12px}.meta b{text-align:right;overflow-wrap:anywhere;font-size:13px}.meta:last-child{border:0}.pill{display:inline-block;padding:3px 9px;border-radius:16px;background:#ebf0df;color:#46552b;font-size:11px;font-weight:700}.warm{color:#994723;background:#fbe6d8}.bubble{background:white;border:1px solid #dedfd7;border-radius:4px 15px 15px;padding:12px;margin:11px 18px 11px 0;overflow-wrap:anywhere}.mine{background:#f8dfce;border-color:#f2d1bb;margin:11px 0 11px 55px;border-radius:15px 4px 15px 15px}.context{font-size:12px;background:#f5f2e9;border-bottom:1px solid #dddccf;padding:8px 15px}.context:empty{display:none}.desk{margin:0}.deskHead{display:flex;align-items:center;gap:8px;padding-bottom:13px;border-bottom:1px solid #e4e5db}.dot{width:8px;height:8px;background:#7e925a;border-radius:50%}.opsBtns{display:grid;gap:7px;margin-top:12px}.note{background:#f3f4ed;border-radius:8px;padding:10px;color:#515846;font-size:12px;margin-top:13px}.timeline{list-style:none;padding:0;margin:8px 0}.timeline li{padding:0 0 11px 14px;border-left:2px solid #dfd8c8;font-size:12px;overflow-wrap:anywhere}.timeline li:first-child{border-color:#cb582d}.timeline b{display:block}.desk select{margin:12px 0}.notice{font-size:12px;color:#95411e;min-height:0}.notice:not(:empty){padding:5px 14px;background:#fff0dd}dialog{border:1px solid #dadbd1;border-radius:14px;width:min(390px,92vw);padding:20px}dialog::backdrop{background:#20221c65}dialog label{display:block;margin:12px 0 4px}dialog .chips{justify-content:flex-end;margin-top:17px}.mono{font:600 13px ui-monospace,monospace}.stamp{margin:20px 0 7px;color:#6f7565;font-weight:700;font-size:12px}.empty{color:#74776c;padding:15px 0}.pict{display:flex;gap:7px;margin-top:6px}.pict img{width:54px;height:54px;object-fit:cover;border-radius:7px}.record{width:100%;text-align:left}.record strong{display:block;margin:8px 0}.sectionHead{margin:14px 0 9px;font-size:13px}.screen .primary,.screen .secondary{margin-top:8px}.tools{display:flex;gap:6px}.tools input{flex:1;min-width:0}.desk p{margin:8px 0}.actionsHint{color:#686c63;margin-top:8px;font-size:12px}@media(max-width:970px){.layout{grid-template-columns:minmax(305px,400px) minmax(250px,350px);justify-content:center}.intro{grid-column:1/-1;padding:0}.intro h1{font-size:30px;margin:5px 0}.intro h1 br,.intro>p,.intro .divider,.intro>.kicker,.intro>.sectionHead{display:none}.cases{display:flex;flex-wrap:wrap}.case{padding:7px 12px}.case small{display:none}.phone{height:730px}}@media(max-width:650px){header.top{height:46px}.layout{display:flex;flex-direction:column;padding:0 12px;margin:14px auto;gap:14px;max-width:450px}.intro h1{font-size:22px;letter-spacing:-1px}.cases{gap:4px}.case{font-size:12px;padding:6px}.phone,.desk{width:100%}.phone{height:76dvh;min-height:515px;border-width:2px;border-radius:20px}.intro{width:100%}}
</style></head><body>
<header class="top"><div class="brand">HOT<i>SHOP</i></div><span>门店服务　/　产品评审 · 离线演示</span></header>
<main class="layout"><aside class="intro"><div class="kicker">HOTMAXX　/　STORE IT</div><h1>门店 IT<br>设备报修</h1><p>从门店第一次求助，到现场确认设备恢复使用。</p><div class="divider"></div><h3 class="sectionHead">演示场景</h3><div class="cases" id="cases"></div></aside>
<section class="phone" aria-label="门店手机页面"><div class="status"><span>9:41</span><span>▮▮▮　Wi-Fi　▰</span></div><nav class="nav"><button onclick="back()" aria-label="返回">‹</button><strong id="title"></strong><button onclick="view('records')" aria-label="历史报修记录">≡</button></nav><div class="context" id="context"></div><div class="notice" role="status" id="notice"></div><div class="screen" id="screen"></div><footer class="foot" id="foot"></footer></section>
<aside class="desk"><div class="deskHead"><span class="dot"></span><h2 style="font-size:18px">运维工作台</h2></div><div id="ops"></div><p class="actionsHint">右侧模拟运维在明道云受理及代录回执。门店在手机页面补充、确认费用或验收。</p></aside></main>
<dialog id="modal"><form id="dialogForm"><h3 id="dialogTitle"></h3><div id="dialogBody"></div><div class="chips"><button type="button" class="secondary" onclick="modal.close()">取消</button><button class="primary">确认</button></div></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),btn=(s,fn,cls='secondary')=>'<button class="'+cls+'" onclick="'+fn+'">'+esc(s)+'</button>',opt=(a,v)=>a.map(s=>'<option '+(s===v?'selected':'')+'>'+esc(s)+'</option>').join(''),meta=(k,v)=>'<div class="meta"><span>'+esc(k)+'</span><b>'+esc(v)+'</b></div>',pill=s=>'<span class="pill">'+esc(s)+'</span>',mask=p=>p.slice(0,3)+'****'+p.slice(-4);
const store='演示门店 · 11522',devices=['电脑','手机','显示器'],impacts=['营业中断','部分受影响','可继续营业'],vendors=['易点租','小熊U租'],hints={电脑:'可查看电脑机身标签。开不了机或标签脱落，直接选“找不到”。',手机:'可在设备信息或包装标签查看编号。超过三年的手机可由运维评估换新。',显示器:'机身编号通常在背面铭牌上，注意和电脑主机区分。'},sym={电脑:'例如：收银电脑开不了机',手机:'例如：巡店手机无法充电',显示器:'例如：背光亮，但没有画面'};
const assets={
  电脑:[{name:'收银台电脑',sn:'DEMO-PC-021',vendor:'易点租'},{name:'办公室电脑',sn:'DEMO-PC-046',vendor:'小熊U租'}],
  手机:[{name:'值班手机',sn:'DEMO-M-012',vendor:'小熊U租'}],
  显示器:[]
};
function assetPicker(){
  if(!d.device)return '';
  const list=assets[d.device];
  if(!list.length)return '<p class="note">本店台账暂无这类设备。机身编号可以留空，由运维协助核验。</p>';
  return '<label>本店已登记设备</label><select aria-label="本店已登记设备" onchange="chooseAsset(this.value)"><option value="">不确定／列表里没有</option>'+list.map(a=>'<option value="'+a.sn+'" '+(a.sn===d.sn?'selected':'')+'>'+a.name+' · 尾号 '+a.sn.slice(-3)+'</option>').join('')+'</select>';
}
function syncPicker(){const picker=document.querySelector('select[aria-label="本店已登记设备"]');if(picker)picker.value=candidate(d)?d.sn:''}
function chooseAsset(sn){d.sn=sn;render()}
function candidate(r){return (assets[r.device]||[]).find(a=>a.sn===r.sn)}
const blank=()=>({category:'IT 设备',device:'',desc:'',impact:'',sn:'',phone:'13800001234',photo:[],messages:[]});
let d=blank(),orders=[],active='',page='home',seq=100,via='form';
const order=()=>orders.find(x=>x.id===active),clock=()=>new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),note=t=>{$('notice').textContent=t};
function rec(data){const r={...data,id:'IT-'+(++seq),status:'待受理',owner:'当班运维',logs:[],photo:[...data.photo]};orders.unshift(r);active=r.id;log(r,'门店提交','已进入 IT 运维队列');return r}
function log(r,who,msg){r.logs.unshift({who,msg,time:clock()})}
function transition(status,who,msg){const r=order();r.status=status;log(r,who,msg);render()}
function openDialog(title,html,done){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=html;$('dialogForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);$('modal').close();done(f)};$('modal').showModal()}
const field=(label,name,value='',required=true,type='text')=>'<label>'+esc(label)+'<input class="input" name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(required?'required ':'')+(type==='number'?'min="0.01" step="0.01" ':'')+'maxlength="180"></label>';
function scenario(i){const a=[['电脑','收银电脑提示空间不足，但备用机可以收银','部分受影响'],['显示器','屏幕破裂，无法显示，背面标签已脱落','营业中断'],['手机','门店手机使用约四年，充不进电','部分受影响']][i];const r=rec({...blank(),device:a[0],desc:a[1],impact:a[2]});if(i===0)r.sn='DEMO-PC-021';r.status='运维处理中';log(r,'当班运维','已认领，请在工作台选择下一步');view('detail')}
$('cases').innerHTML=[['远程排障','电脑提示空间不足'],['物损报价','显示器破裂 · 标签缺失'],['手机换新','使用约四年 · 无法充电']].map(([a,b],i)=>'<button class="case" onclick="scenario('+i+')"><span><b>'+a+'</b><small>'+b+'</small></span><i>↗</i></button>').join('');
function view(p){page=p;render();$('screen').scrollTop=0}
function back(){view(({form:'home',chat:'form',review:via,detail:'records',records:'home',result:'records'})[page]||'home')}
function selectOrder(id){active=id;view('detail')}
function setDevice(v){if(d.device!==v){d.device=v;d.sn='';d.photo=[]}render()}
function changeCategory(v){if(v===d.category)return;d.category=v;render()}
function changePhone(){openDialog('修改现场联系电话','<label>手机号码<input name="phone" class="input" required pattern="1[0-9]{10}" maxlength="11" value="'+esc(d.phone)+'"></label>',f=>{d.phone=f.get('phone');render()})}
function photoInput(){return '<label>故障照片（选填）<input type="file" accept="image/*" multiple onchange="photos(this)"></label>'+pic(d.photo)}
function pic(a){return '<div class="pict">'+a.map(f=>'<img src="'+esc(f.url)+'" alt="'+esc(f.name)+'">').join('')+'</div>'}
function photos(el){const files=[...el.files];if(files.some(f=>!f.type.startsWith('image/')||f.size>10*1024*1024)||d.photo.length+files.length>5){note('请选择图片，最多 5 张，每张不超过 10 MB');el.value='';return}d.photo.push(...files.map(f=>({url:URL.createObjectURL(f),name:f.name})));render()}
function deviceSelect(){return '<select aria-label="故障设备" onchange="setDevice(this.value)">'+opt(['',...devices],d.device)+'</select>'}
function verify(from){via=from;if(!d.device||!d.desc.trim()||!d.impact){note('请先补充设备、故障现象和营业影响');return}view('review')}
function render(){const s=$('screen'),foot=$('foot');s.innerHTML='';foot.innerHTML='';note('');$('context').innerHTML='';$('title').textContent=({home:'服务助手',form:'我要报修',chat:'AI 智能填报',review:'核对报修单',result:'提交结果',records:'历史报修记录',detail:'报修详情'})[page];
if(page==='home'){s.innerHTML='<div class="hero"><small>当前门店</small><h2>商之都门店</h2><span class="mono">11522</span></div><button class="card go" onclick="view(\'form\')"><span class="icon">↗</span><span><strong>我要报修</strong><small>工程、营运用具、广告与 IT 设备</small></span><em>›</em></button><button class="card go" onclick="view(\'records\')"><span><strong>历史报修记录</strong><small>查看进度、补充信息与验收</small></span><em>›</em></button>'}
if(page==='form'){s.innerHTML='<button class="hero go" onclick="enterChat()"><span class="icon">✦</span><span><strong>AI 智能填报</strong><small>说说出了什么问题</small></span><em>›</em></button><div class="card">'+meta('报修门店',store)+'<label>报修类别</label><select aria-label="报修类别" onchange="changeCategory(this.value)">'+opt(['IT 设备','工程类','门店广告','营运用具'],d.category)+'</select></div>'+(d.category==='IT 设备'?'<div class="card"><h3>设备与故障</h3><label>故障设备</label>'+deviceSelect()+'<label>故障现象</label><textarea aria-label="故障现象" maxlength="100" placeholder="'+(sym[d.device]||'设备出了什么问题？')+'" oninput="d.desc=this.value">'+esc(d.desc)+'</textarea><label>营业影响</label><select aria-label="营业影响" onchange="d.impact=this.value">'+opt(['',...impacts],d.impact)+'</select>'+assetPicker()+'<label>机身编号（选填）</label><input class="input" aria-label="机身编号" placeholder="找不到可留空" value="'+esc(d.sn)+'" oninput="d.sn=this.value.trim();syncPicker()" maxlength="80"><small>'+esc(hints[d.device]||'可在受理后由运维协助核实。')+'</small>'+photoInput()+'</div><div class="card row"><small>现场联系电话　'+mask(d.phone)+'</small>'+btn('修改','changePhone()','chip')+'</div>':'<div class="card"><h3>'+esc(d.category)+'报修</h3><p>沿用现有普通报修字段：类别明细、故障描述、现场照片与联系电话。本次演示可切回 IT 设备继续。</p></div>');if(d.category==='IT 设备')foot.innerHTML=btn('核对报修单',"verify('form')",'primary')}
if(page==='chat'){drawChat()}
if(page==='review'){s.innerHTML='<div class="hero"><small>提交前核对</small><h2>IT 报修预填确认单</h2></div><div class="card">'+summary(d)+pic(d.photo)+btn('修改信息',"view('form')",'chip')+'</div>';foot.innerHTML=btn('确认并提交','submitOrder()','primary')}
if(page==='result'){const r=order();s.innerHTML='<div class="hero"><small>✓ 已提交</small><h2>运维已收到报修</h2><p class="mono">'+r.id+'</p></div><div class="card">'+meta('当前状态',r.status)+meta('下一步',next(r))+'</div>';foot.innerHTML=btn('查看这张报修单',"view('detail')",'primary')}
if(page==='records'){s.innerHTML=orders.length?orders.map(r=>'<button class="record card" onclick="selectOrder(\''+r.id+'\')"><div class="row"><span class="mono">'+r.id+'</span>'+pill(r.status)+'</div><strong>'+esc(r.device)+' · '+esc(r.desc)+'</strong><small>'+esc(next(r))+'</small></button>').join(''):'<div class="card"><h3>暂无报修记录</h3><p>提交后可在这里查看进度。</p></div>';foot.innerHTML=btn('我要报修',"view('form')",'primary')}
if(page==='detail'&&order())detail();drawOps()}
function summary(x){return meta('门店',store)+meta('设备',x.device)+meta('现象',x.desc)+meta('营业影响',x.impact)+meta('机身编号',x.sn||'待运维协助核验')+meta('现场联系',mask(x.phone))+meta('照片',x.photo.length+' 张')}
function submitOrder(){if(page!=='review')return;rec(d);d=blank();view('result')}
function enterChat(){d.category='IT 设备';view('chat')}
function say(t){t=t.trim();if(!t)return;d.messages.push(t);if(!d.desc)d.desc=t.slice(0,100);else d.desc=(d.desc+'；'+t).slice(0,100);const dev=devices.find(x=>t.includes(x));if(dev&&dev!==d.device){d.device=dev;d.sn='';d.photo=[]}if(/无法营业|营业中断|不能收银/.test(t))d.impact=impacts[0];render();$('screen').scrollTop=$('screen').scrollHeight}
function drawChat(){const s=$('screen');$('context').innerHTML='<div class="row"><span>'+store+'　'+mask(d.phone)+'</span>'+btn('修改电话','changePhone()','chip')+'</div>';let html='<div class="row"><b>✦　AI 报修助手</b>'+pill('采集中')+'</div><div class="bubble">哪台设备出了什么问题？可以直接说，也可以点下面的例子。</div>';html+=d.messages.map(t=>'<div class="bubble mine">'+esc(t)+'</div>').join('');if(!d.desc)html+='<div class="chips">'+['电脑开不了机，无法营业','手机无法充电','显示器黑屏'].map(x=>btn(x,"say('"+x+"')",'chip')).join('')+'</div>';else {html+='<div class="bubble">已整理故障现象，请核对设备和营业影响。</div><div class="card">'+meta('故障现象',d.desc)+'<label>设备类别</label>'+deviceSelect()+'<label>营业影响</label><div class="chips">'+impacts.map(x=>btn((d.impact===x?'✓ ':'')+x,"d.impact='"+x+"';render()",'chip')).join('')+'</div></div>';if(d.device&&d.impact)html+='<div class="card"><h3>设备线索</h3><small>'+hints[d.device]+'</small>'+assetPicker()+'<label>机身编号（可跳过）</label><input class="input" aria-label="机身编号" value="'+esc(d.sn)+'" placeholder="标签缺失也可继续" maxlength="80" oninput="d.sn=this.value.trim();syncPicker()">'+photoInput()+'</div>'}s.innerHTML=html;$('foot').innerHTML=(d.device&&d.desc&&d.impact?btn('核对预填信息',"verify('chat')",'primary'):'')+'<form class="tools" onsubmit="event.preventDefault();say(this.elements.words.value)"><input name="words" aria-label="对话输入" class="input" maxlength="100" placeholder="描述或补充故障…"><button class="primary">发送</button></form>'+btn('切回表单继续',"view('form')",'chip')}
function next(r){return ({待受理:'当班运维认领',运维处理中:'运维分诊并更新处理方案',待补充:'门店在原单补充所需信息',待接单:'运维跟踪供应商接单',维修中:'供应商联系门店，运维跟踪',待核价:'运维核实责任及本次报价',待费用确认:'有费用权限的门店负责人确认',换新跟踪:'运维跟踪 IT 申请及交付',待验收:'现场联系人试用设备',已恢复:r.feeDue&&!r.settled?'财务跟进费用核销':'门店已确认可用'})[r.status]}
function detail(){const r=order();$('screen').innerHTML='<div class="hero"><div class="row"><span class="mono">'+r.id+'</span>'+pill(r.status)+'</div><h2>'+esc(r.device)+'报修</h2><p>'+esc(next(r))+'</p></div><div class="card">'+meta('故障现象',r.desc)+meta('营业影响',r.impact)+meta('负责人',r.owner)+(r.vendor?meta('服务商',r.vendor):'')+(r.quote?meta('当前报价','¥'+r.quote+' · 第 '+r.version+' 版'):'')+(r.app?meta('IT 申请号',r.app):'')+(r.feeDue?meta('费用状态',r.settled?'已核销':'待财务核销'):'')+pic(r.photo)+'</div><div class="card"><h3>处理记录</h3><ul class="timeline">'+r.logs.map(e=>'<li><b>'+esc(e.who)+'　<small>'+e.time+'</small></b>'+esc(e.msg)+'</li>').join('')+'</ul></div>';let actions='';if(r.status==='待补充')actions=btn('补充信息', "memo('门店补充','请补充运维所需信息','运维处理中','门店')",'primary');if(r.status==='待费用确认')actions='<small>演示身份 · 有费用确认权限的店长</small>'+btn('同意 ¥'+r.quote+' · 第 '+r.version+' 版','approveQuote()','primary')+btn('退回报价',"memo('退回报价','原因','待核价','门店负责人')");if(r.status==='待验收')actions=btn('已试用，确认恢复',"transition('已恢复','现场联系人','现场试用，设备已恢复可用')",'primary')+btn('仍有问题，继续处理',"memo('验收未通过','还有什么问题？','运维处理中','现场联系人')");$('foot').innerHTML=actions}
function memo(title,label,status,who){openDialog(title,field(label,'msg'),f=>transition(status,who,title+' · '+f.get('msg')))}
function dispatch(){const r=order();openDialog('核实归属并派单','<p>'+esc(candidate(r)?'本店台账候选：'+candidate(r).name+' · '+candidate(r).vendor:'归属待核实。请查原出库单或联系供应商核实。')+'</p><p>机身编号：'+esc(r.sn||'未知')+'</p><label>服务商<select name="vendor" required>'+opt(['',...vendors],candidate(r)?.vendor||'')+'</select></label>'+field('归属依据（单据号或核实记录）','proof'),f=>{r.vendor=f.get('vendor');transition('待接单','运维派单',r.vendor+' · '+f.get('proof'))})}
function price(){const r=order();openDialog('登记供应商报价',field('本次总价（元）','amount','',true,'number')+field('损坏责任依据、维修项目及报价来源','proof'),f=>{r.version=(r.version||0)+1;r.quote=Number(f.get('amount')).toFixed(2);r.feeDue=false;transition('待核价','运维代录供应商报价','第 '+r.version+' 版 · ¥'+r.quote+' · '+f.get('proof'))})}
function approveQuote(){const r=order();r.feeDue=true;transition('维修中','门店负责人','同意第 '+r.version+' 版报价 ¥'+r.quote+'，授权收费维修')}
function replaceIt(){const r=order();openDialog('关联 IT 换新申请','<p>手机使用超过三年可提请评估。关联申请后仍需跟踪审批和到货。</p>'+field('已发起的 IT 申请号','app')+field('评估依据或设备年限来源','reason'),f=>{r.app=f.get('app');transition('换新跟踪','运维关联申请',r.app+' · '+f.get('reason'))})}
function drawOps(){const box=$('ops'),r=order();if(!r){box.innerHTML='<p class="empty">当前没有待办工单。</p><div class="note">在手机上提交一张 IT 报修单，或从左侧选择一个已有故障场景。</div>';return}const memoBtn=(a,b,c,w='当班运维')=>btn(a,"memo('"+a+"','"+b+"','"+c+"','"+w+"')");const menu={
'待受理':[btn('认领工单',"transition('运维处理中','当班运维','已认领，开始分诊')",'primary')],
'运维处理中':[memoBtn('远程处理完成','处理动作及门店验证方法','待验收'),btn('核验归属并派单','dispatch()'),memoBtn('请门店补充','缺少哪项信息？','待补充'),btn('关联换新申请','replaceIt()')],
'待补充':[],'待接单':[memoBtn('登记接单回执','接单人及预约时间','维修中','运维代录'),memoBtn('拒单／改派','原因及跟进人','运维处理中')],
'维修中':[memoBtn('登记完工回执','服务商反馈的维修结果及试用方法','待验收','运维代录'),btn('登记收费报价','price()')],
'待核价':[memoBtn('核价通过，发送门店','核价依据及报价有效期','待费用确认'),btn('登记议价后新报价','price()'),memoBtn('退回重新分诊','协商结果与后续建议','运维处理中')],
'待费用确认':[btn('变更报价，重新核价','price()')],'换新跟踪':[memoBtn('批准且已交付','新机交接凭证、旧机去向','待验收'),memoBtn('申请退回','拒批原因或替代方案','运维处理中')],
'待验收':[],'已恢复':r.feeDue&&!r.settled?[btn('代录财务核销回执','settle()')]:[]};box.innerHTML='<label>当前工单<select onchange="selectOrder(this.value)">'+orders.map(x=>'<option value="'+x.id+'" '+(x===r?'selected':'')+'>'+x.id+' · '+esc(x.device)+' · '+esc(x.status)+'</option>').join('')+'</select></label><div class="row"><strong>'+esc(r.device)+'报修</strong>'+pill(r.status)+'</div><p>'+esc(r.desc)+'</p>'+meta('营业影响',r.impact)+meta('机身编号',r.sn||'未知 · 待核验')+(r.vendor?meta('服务商',r.vendor):'')+(r.quote?meta('报价','¥'+r.quote+' / V'+r.version):'')+'<div class="note">'+esc(next(r))+'</div><div class="opsBtns">'+menu[r.status].join('')+'</div>'+((page!=='detail')?btn('打开门店侧详情',"view('detail')",'chip'):'')}
function settle(){const r=order();openDialog('代录财务核销回执',field('核销凭证编号','ref'),f=>{r.settled=true;log(r,'运维代录财务回执','已核销 · '+f.get('ref'));render()})}
render();
</script></body></html>
