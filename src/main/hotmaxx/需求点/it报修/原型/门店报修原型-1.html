:root{color-scheme:light}
:root{
  --accent:#ee8745;        /* App 主色（橙） */
  --accent-deep:#c9682a;   /* 主色文字/描边加深 */
  --accent-bg:#fdeee1;     /* 主色浅底 */
  --accent-line:#f5c9a9;   /* 主色浅描边 */
  --ink:#262626; --muted:#8f8f8f; --line:#ececec; --bg:#f0f0f0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#f0f0f0;color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
button:disabled{cursor:default;opacity:.55}
button:focus-visible{outline:3px solid #f6b98d;outline-offset:2px}
input,textarea,select{border:1px solid #e3e3e3;border-radius:8px;background:#fff;color:var(--ink);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #ee874522}

/* ============ 页面容器（整页嵌入；桌面预览时居中一列） ============ */
.app{max-width:520px;margin:0 auto;height:100dvh;min-height:480px;display:flex;
  flex-direction:column;background:#fff;position:relative;overflow:hidden}
@media(min-width:600px){
  body{background:#e8e8e8}
  .app{height:100dvh;box-shadow:0 0 44px rgba(0,0,0,.10)}
}

/* ============ 顶部 ============ */
.chathead{padding:10px 12px 10px 8px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:10px;background:#fff;flex-shrink:0;
  padding-top:calc(10px + env(safe-area-inset-top))}
.backbtn{width:34px;height:34px;border-radius:9px;font-size:20px;line-height:1;
  color:#555;background:#f5f5f5;flex-shrink:0;display:grid;place-items:center}
.backbtn:active{background:#ececec}
.spark{font-size:20px;color:var(--accent);background:var(--accent-bg);border-radius:10px;
  width:38px;height:38px;display:grid;place-items:center;flex-shrink:0}
.chathead strong{font-size:15px;display:block;line-height:1.3}
.chathead small{display:block;color:var(--muted);font-size:10px}
.statebadge{margin-left:auto;font-size:10px;color:#8a8a8a;background:#f5f5f5;
  border-radius:12px;padding:4px 9px;white-space:nowrap;flex-shrink:0}
.context{background:#fdf7f1;padding:9px 16px;border-bottom:1px solid #f3e4d7;font-size:11px;
  color:#9c8370;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-shrink:0}
.context strong{font-size:12px;color:var(--accent-deep);display:block;margin-bottom:1px}
.textbtn{color:var(--accent);padding:0;font-size:12px}

/* ============ 消息流 ============ */
.scroll{overflow-y:auto;flex:1;min-height:0;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.chatbody{background:var(--bg);padding:16px 14px}
.date{text-align:center;color:#b5b5b5;font-size:10px;margin-bottom:14px}
.msg{display:flex;gap:8px;margin:14px 0;align-items:flex-start;animation:fin .18s ease}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.avatar{width:28px;height:28px;background:var(--accent-bg);color:var(--accent);border-radius:9px;
  display:grid;place-items:center;flex-shrink:0;font-weight:700;font-size:15px}
.bubble{max-width:calc(100% - 36px);background:#fff;border:1px solid var(--line);
  padding:11px 13px;border-radius:3px 13px 13px 13px;font-size:13px;line-height:1.75;min-width:0}
.msg.user{justify-content:flex-end}
.user .bubble{background:var(--accent);color:#fff;border:0;border-radius:13px 3px 13px 13px}
.bubble p{margin:0 0 8px}
.bubble p:last-child{margin:0}
.bubble small{color:#9a9a9a;font-size:11px;display:block;margin-top:6px}
.user .bubble small{color:#ffe4cf}
.dots{display:inline-flex;gap:3px;margin-right:5px;vertical-align:middle}
.dots i{width:5px;height:5px;border-radius:50%;background:#c4b0a2;animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.18s}
.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* 高频卡片墙 */
.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.quick{border:1px solid #f0e6dd;border-radius:9px;padding:11px 7px;text-align:left;
  font-size:11px;background:#fffdfb;color:var(--ink)}
.quick i{display:block;font-style:normal;font-size:19px;margin-bottom:3px}
.quick.selected{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-deep)}

/* 类别单选（enum_card） */
.options{display:grid;gap:8px;margin-top:8px}
.options.full{max-height:262px;overflow-y:auto;padding-right:2px}
.option{border:1px solid #ececec;text-align:left;border-radius:9px;padding:10px 11px;
  font-size:12px;background:#fff;color:var(--ink)}
.option.grp{font-weight:600;background:#fffdfb}
.option.back{color:#9a9a9a;background:#fafafa;font-weight:400}
.option.pre{border-color:var(--accent-line);background:#fff4ea;color:var(--accent-deep);font-weight:600}
.option.cur{border-color:#9fd4b8;background:#f2faf6;color:#1e7a4f;font-weight:600}
.option.selected{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-deep);font-weight:600}
.option small{display:block;color:#a8a8a8;font-size:10px;margin-top:2px;font-weight:400}

/* 二选一（seg_card）：等宽两列、永不换行——「可等待安排」5 字也一行放下 */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:10px}
.seg button{border:1px solid #e8e8e8;border-radius:10px;background:#fff;padding:9px 10px;
  min-width:64px;font-size:13px;font-weight:500;text-align:center;white-space:nowrap}
.seg button.selected{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-deep);font-weight:600}

/* 拍照引导（photo_guide） */
.ptips{margin:9px 0 0;display:grid;gap:6px}
.ptip{font-size:12px;color:#5c5c5c;display:flex;gap:7px;align-items:flex-start;line-height:1.5}
.ptip i{font-style:normal;flex-shrink:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.actions button{font-size:12px}
.primary{background:var(--accent);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600}
.primary:active{background:#e07a35}
.outline{border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 14px;color:#555}
.pill{font-size:12px;border-radius:20px;background:var(--accent-bg);color:var(--accent-deep);padding:3px 10px}
.pill.doing{color:#b07a2a;background:#fdf3e3}
.pill.ok{color:#279b70;background:#e9f7ef}

/* 系统提示条（system_tip） */
.stip{margin:14px auto;max-width:88%;text-align:center;font-size:11px;border-radius:8px;
  padding:8px 12px;line-height:1.6;animation:fin .18s ease}
.stip.info{background:#f5f5f5;color:#777}
.stip.warn{background:#fdf3e3;color:#b07a2a}
.stip.error{background:#fdf1f0;color:#b3543f}

/* 确认单（confirm_card） */
.confirmwrap{display:block}               /* 确认单独立成卡：左右各让出 36px（同头像列宽），与对话文字对齐且左右对称 */
.confirmwrap .avatar{display:none}
.confirmwrap .bubble{width:calc(100% - 72px);margin:0 auto;max-width:100%;border-radius:12px}
.confirm{margin-top:2px;min-width:0}
.confirm h3{font-size:15px;margin:0 0 3px}
.confirm>small{display:block;color:#a5a5a5;font-size:10px;margin-bottom:2px}
.sectionlabel{font-size:10px;color:#9a9a9a;padding:14px 0 5px;border-top:1px solid var(--line);margin-top:10px}
.confirm .sectionlabel:first-of-type{border-top:0;margin-top:6px}
.data-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:7px 0;align-items:flex-start}
.data-row>span{color:#8f8f8f;flex-shrink:0}
.data-row b,.data-row button{font-weight:500;text-align:right;overflow-wrap:anywhere;margin-left:auto;color:#4a4a4a;font-size:12px;padding:0}
.data-row button{color:var(--accent-deep)}
.data-row button::after{content:' ›'}
.badge-ai{display:inline-block;font-size:9px;background:var(--accent-bg);color:var(--accent-deep);
  border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px;font-weight:600}
.detail{background:#fafafa;border-radius:6px;padding:10px;font-size:12px;white-space:pre-wrap;margin:6px 0;overflow-wrap:anywhere}
.missnote{color:#b3543f;font-size:11px;background:#fdf1f0;border-radius:6px;padding:7px 10px;margin-top:8px}
.stale{opacity:.5}
.stale button{pointer-events:none}
.attachment{padding:8px;background:#faf6f2;border-radius:7px;font-size:11px;margin-top:8px;
  overflow-wrap:anywhere;display:flex;gap:8px;align-items:center}
.athumb{width:52px;height:40px;border-radius:5px;overflow:hidden;flex-shrink:0;background:#f0e9e2;
  display:inline-block}
.athumb svg,.athumb img{width:100%;height:100%;object-fit:cover;display:block}
.ph-inline .athumb{width:30px;height:24px;margin-left:3px;vertical-align:middle}

/* 结果卡（result） */
.success{text-align:center}
.success-icon{display:grid;place-items:center;background:#e6f6ee;color:#29a976;border-radius:50%;
  height:48px;width:48px;margin:8px auto;font-size:26px}
.success h3{margin:10px 0 4px}
.success .number{background:#f7f7f7;padding:11px;border-radius:8px;font-size:12px;margin:14px 0}

function addPhotos(names){const merged=[...new Set([...d.photos,...names])];if(merged.length>5)return toast('每张报修单最多 5 张照片');d.photos=merged;d.photoChecked=true;refresh()}
const previews=new Map();
$('file').onchange=e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;if(fs.some(x=>!x.type.startsWith('image/')||x.size>3*1024*1024))return toast('请选择不超过 3 MB 的图片');for(const x of fs){if(previews.has(x.name))URL.revokeObjectURL(previews.get(x.name));previews.set(x.name,URL.createObjectURL(x))}addPhotos(fs.map(x=>x.name))};
function photoButtons(){return '<div class="uploads">'+action('＋ 添加照片',"document.getElementById('file').click()")+action('使用演示照片',"addPhotos(['现场照片（演示）.jpg'])")+'</div>'}
function frow(label,html,req=false){return '<div class="frow"><label '+(req?'class="req"':'')+'>'+label+'</label>'+html+'</div>'}
function select(label,values,v,fn){return '<select aria-label="'+label+'" class="fr" onchange="'+fn+'">'+options(values,v)+'</select>'}
function textField(label,k,type='text'){return '<input aria-label="'+label+'" class="fr" type="'+type+'" maxlength="'+(k==='phone'?11:50)+'" value="'+esc(d[k])+'" oninput="d.'+k+'=this.value">'}
function pickCategory(groupIndex=-1){
 const names=Object.keys(groups);
 if(groupIndex<0){
   modal('报修类别','<div class="options">'+names.map((name,i)=>action(name,'pickCategory('+i+')','option')).join('')+'</div>');
   return;
 }
 const name=names[groupIndex], leaves=groups[name];
 if(!leaves.length)return finishCategory(groupIndex,-1);
 modal(name,action('‹ 返回类别','pickCategory()','textbtn')+'<div class="options">'+leaves.map((leaf,i)=>action(leaf,'finishCategory('+groupIndex+','+i+')','option')).join('')+'</div>');
}
function finishCategory(g,i){
 const group=Object.keys(groups)[g],leaf=groups[group][i]||'';
 const changed=d.group!==group||d.leaf!==leaf;
 setCategory(group,leaf);candidates=[];if(changed)d.history=[];closeModal();form();
 if(changed&&d.photos.length)toast('请核对已有照片是否对应这台设备');
}
function chooseVisit(i){d.visit=visits[i];if(page==='chat')answer('期望上门',d.visit);else{closeModal();form()}}
function visitMenu(){modal('期望上门','<div class="options">'+visits.map((v,i)=>action(v,'chooseVisit('+i+')','option')).join('')+'</div>')}
function choosePhoto(){modal('添加现场照片','<div class="options">'+action('选择图片',"closeModal();document.getElementById('file').click()",'option')+action('使用演示照片',"closeModal();addPhotos(['现场照片（演示）.jpg'])",'option')+'</div>')}
function pickRow(label,value,fn){
 return '<button type="button" aria-label="'+label+'" class="pickvalue '+(value?'':'empty')+'" onclick="'+fn+'">'+esc(value||'请选择')+' <span aria-hidden="true">›</span></button>'
}
function form(){
 $('err').textContent='';
 const value=v=>'<span class="fval">'+esc(v)+'</span>';
 const serial=isIT()&&d.leaf?frow('设备序列号','<button type="button" class="snhelp" aria-label="如何找设备序列号" onclick="modal(\'如何找设备序列号\',guide[d.leaf])">?</button><input class="plaininput" aria-label="设备序列号" maxlength="50" placeholder="选填，找不到可跳过" value="'+esc(d.sn)+'" oninput="d.sn=this.value">'):'';
 const impact=impacts.map(v=>'<label><input type="radio" name="impact" value="'+v+'" '+(d.impact===v?'checked':'')+' onchange="d.impact=this.value">'+v+'</label>').join('');
 $('traditional').innerHTML='<section class="sheetcard"><h2>基础信息</h2>'+
 frow('门店名称',value(store))+frow('报修类别',pickRow('报修类别',path(),'pickCategory()'),true)+serial+
 frow('报修人员',value(d.person))+frow('报修日期',value(d.date.replaceAll('-','/')))+
 '<div class="field describe"><label for="description" class="req">描述具体故障</label><div class="writing"><textarea id="description" maxlength="100" oninput="d.desc=this.value;document.getElementById(\'count\').textContent=this.value.length" placeholder="请描述故障现象、发生时间、影响范围等…">'+esc(d.desc)+'</textarea><div class="counter"><span id="count">'+d.desc.length+'</span>/100</div></div></div>'+
 '<div class="field photoField"><label class="req">现场照片(3MB以内)</label><div class="thumbset">'+d.photos.map((file,i)=>'<div class="phototile">'+(previews.has(file)?'<img alt="'+esc(file)+'" src="'+esc(previews.get(file))+'">':'<span>'+esc(file)+'</span>')+'<button type="button" aria-label="移除照片" onclick="removePhoto('+i+')">×</button></div>').join('')+
 (d.photos.length<5?'<button type="button" class="plus" aria-label="添加现场照片" onclick="choosePhoto()">＋</button>':'')+'</div></div></section>'+
 '<section class="sheetcard"><h2>期望处理</h2>'+frow('期望上门',pickRow('期望上门',d.visit,'visitMenu()'),true)+frow('影响营业','<div class="radios">'+impact+'</div>',true)+
 frow('联系电话','<input class="plaininput" type="tel" aria-label="联系电话" maxlength="11" placeholder="请填写" value="'+esc(d.phone)+'" oninput="d.phone=this.value;d.phoneChecked=false">',true)+'</section>';
}
function missing(){if(!d.group||(groups[d.group]?.length&&!d.leaf))return '报修类别';if(!d.desc.trim())return '描述具体故障';if(!d.photos.length)return '现场照片（至少一张，每张不超过 3 MB）';if(!d.visit)return '期望上门';if(!impacts.includes(d.impact))return '影响营业（是或否）';if(!/^1[3-9]\d{9}$/.test(d.phone))return '有效的 11 位联系电话';return ''}
function sendForm(){const err=missing();if(err){$('err').textContent='请补充'+err;return}submitOrder()}
function confirmRows(x){return [['报修类别',[x.group,x.leaf].filter(Boolean).join(' › ')],...(x.group===IT?[['设备序列号',x.sn||'待运维核实']]:[]),['描述具体故障',x.desc],['现场照片',x.photos.join('、')],['期望上门',x.visit],['影响营业',x.impact],['联系电话',mask(x.phone)]]}

function rows(items){return items.map(([k,v])=>'<div class="data-row"><span>'+esc(k)+'</span><b>'+esc(v)+'</b></div>').join('')}
function confirmCard(){return '<div class="confirm fields"><h3>报修预填确认单</h3><small>请核对类别、故障信息和联系方式</small><div class="sectionlabel">基础信息</div>'+rows([['门店名称',store],['报修人员',d.person||'未提供'],['报修日期',d.date]])+'<div class="sectionlabel">报修内容</div>'+rows(confirmRows(d))+action('修改报修信息',"editChatOrder()",'textbtn')+'</div>'}
function editChatOrder(){
 modal('修改报修信息','<div class="options">'+action('修改报修类别','closeModal();allCategories()','option')+action('修改故障描述','editDescription()','option')+(isIT()?action('修改设备序列号',"closeModal();edit(\'sn\')",'option'):'')+action('修改现场照片','editChatPhotos()','option')+action('修改期望上门','editChatVisit()','option')+action('修改影响营业','editChatImpact()','option')+action('修改联系电话',"closeModal();edit(\'phone\')",'option')+'</div>');
}
function editDescription(){modal('修改故障描述','<form id="editDescription"><textarea name="value" maxlength="100" required>'+esc(d.desc)+'</textarea><button class="primary">保存</button></form>');$('editDescription').onsubmit=e=>{e.preventDefault();d.desc=e.target.elements.value.value.trim();if(!d.desc)return;closeModal();chat()}}
function editChatPhotos(){modal('修改现场照片',photosHtml()+action('添加照片',"closeModal();document.getElementById('file').click()")+action('完成','closeModal();chat()','primary'))}
function editChatVisit(){modal('修改期望上门','<div class="options">'+visits.map((v,i)=>action(v,'closeModal();chooseVisit('+i+')','option')).join('')+'</div>')}
function editChatImpact(){modal('修改影响营业','<div class="options">'+impacts.map((v,i)=>action(v,'closeModal();setImpact('+i+')','option')).join('')+'</div>')}
const bot=html=>'<div class="msg"><div class="avatar">✦</div><div class="bubble">'+html+'</div></div>',user=t=>'<div class="msg user"><div class="bubble">'+esc(t)+'</div></div>';
function answer(q,a){d.history.push({q,a});chat()}
function cardWall(){return '<small>说不好？点下面的常见问题更快：</small><div class="quickgrid">'+quicks.map(([ic,t],i)=>'<button class="quick '+(i===6?'it-quick':'')+'" onclick="pickQuick('+i+')"><i>'+ic+'</i><span>'+t+(i===6?'<small>电脑、手机、显示器</small>':'')+'</span>'+(i===6?'<em>›</em>':'')+'</button>').join('')+'</div>'}
function pickQuick(i){const [icon,title,g,leaves]=quicks[i];setCategory(g,leaves.length===1?leaves[0]:'');candidates=leaves;if(i!==6&&!d.desc)d.desc=title;answer('选择常见问题',title)}
function pickChatLeaf(i){const l=candidates[i];setCategory(d.group,l);candidates=[];answer('请选择'+(isIT()?'故障设备':'类别明细'),l)}
function setImpact(i){d.impact=impacts[i];answer('故障对营业有什么影响？',d.impact)}
function skipSn(){d.snChecked=true;answer('能找到设备序列号吗？','暂时找不到，请运维协助核验')}
function skipPhoto(){d.photoChecked=true;answer('是否补充现场照片？','暂不提供照片')}
function confirmPhone(){if(!d.phone)d.phone=basePhone;if(!/^1[3-9]\d{9}$/.test(d.phone))return edit('phone');d.phoneChecked=true;answer('确认联系电话',mask(d.phone))}
function edit(k){const label=k==='sn'?'设备序列号':'联系电话';modal('填写'+label,'<form id="editbox"><label>'+label+'<input required aria-label="'+label+'" name="v" maxlength="'+(k==='sn'?50:11)+'" '+(k==='phone'?'pattern="1[3-9][0-9]{9}" type="tel"':'')+' value="'+esc(d[k])+'"></label><button class="primary">保存</button></form>');$('editbox').onsubmit=e=>{e.preventDefault();let v=e.target.elements.v.value.trim();if(!v)return;d[k]=v;d[k==='sn'?'snChecked':'phoneChecked']=true;closeModal();answer(label,k==='phone'?mask(v):v)}}
function chatStage(){if(!d.group)return 'category';if(groups[d.group].length&&!d.leaf)return 'leaf';if(!d.desc.trim())return 'desc';if(isIT()&&!d.sn&&!d.snChecked)return 'sn';if(!d.photos.length)return 'photos';if(!d.visit)return 'visit';if(!impacts.includes(d.impact))return 'impact';if(!d.phoneChecked||!/^1[3-9]\d{9}$/.test(d.phone))return 'phone';return 'confirm'}
function chat(){
 const stage=chatStage();document.querySelectorAll('.step').forEach((x,i)=>x.classList.toggle('active',i===(stage==='confirm'?2:1)));$('ctx').innerHTML='<strong>📍 '+store+'</strong>报修人：'+esc(d.person||'未提供')+' · '+esc(mask(d.phone||basePhone));$('badge').textContent=stage==='confirm'?'待确认':'采集中';
 let html=bot('直接说哪里坏了，我来帮你整理报修信息。');for(const item of d.history)html+=bot(esc(item.q))+user(item.a);
 if(stage==='category')html+=bot(cardWall()+action('查看全部报修类别','allCategories()','textbtn'));
 if(stage==='leaf'){if(!candidates.length)candidates=groups[d.group];html+=bot('<strong>'+esc(d.group)+'</strong><p>请选择'+(isIT()?'故障设备':'类别明细')+'</p><div class="options">'+candidates.map((x,i)=>action(x,'pickChatLeaf('+i+')','option')).join('')+'</div>'+action('更换大类','allCategories()','textbtn'))}
 if(stage==='desc')html+=bot('已选 <strong>'+esc(path())+'</strong>。设备有什么故障？可在下方输入。'+(samples[d.leaf]?'<div class="actions">'+action(samples[d.leaf],'useSample()')+'</div>':''));
 if(stage==='visit')html+=bot('期望什么时候上门？<div class="options">'+visits.map((v,i)=>action(v,'chooseVisit('+i+')','option')).join('')+'</div>');
 if(stage==='impact')html+=bot('是否影响营业？<div class="seg">'+impacts.map((x,i)=>action(x,'setImpact('+i+')')).join('')+'</div>');
 if(stage==='sn')html+=bot('<strong>设备序列号（选填）</strong><p>'+esc(guide[d.leaf])+'</p><div class="actions">'+action('填写设备序列号',"edit('sn')")+action('找不到，继续','skipSn()')+'</div>');
 if(stage==='photos')html+=bot('<strong>现场照片(3MB以内)</strong><p>请添加一张能看清设备或故障的照片。</p>'+photoButtons());
 if(stage==='phone')html+=bot('联系电话用 <strong>'+esc(mask(d.phone||basePhone))+'</strong> 吗？<div class="actions">'+action('用这个号码','confirmPhone()','primary')+action('更换号码',"edit('phone')")+'</div>');
 if(stage==='confirm')html+='<div class="msg confirmwrap"><div class="bubble">'+confirmCard()+'</div></div>';
 $('messages').innerHTML=html;$('submitBar').classList.toggle('on',stage==='confirm');requestAnimationFrame(()=>{const m=$('messages');m.scrollTop=stage==='category'&&!d.history.length?0:m.scrollHeight});
}
function allCategories(){const gs=Object.keys(groups);modal('选择报修类别','<div class="options">'+gs.map((x,i)=>action(x,'pickGroup('+i+')','option')).join('')+'</div>')}
function pickGroup(i){const g=Object.keys(groups)[i];closeModal();setCategory(g);candidates=groups[g];answer('选择报修类别',g)}
function useSample(){d.desc=samples[d.leaf];answer('请描述故障现象',d.desc)}
function sendText(){const t=$('input').value.trim();if(!t)return;$('input').value='';const stage=chatStage();
 if(/(?:改|换|修改|更换).*(?:联系号码|手机号|联系电话|电话号)/.test(t))return edit('phone');
 if(stage==='sn'){if(/找不到|没有|跳过/.test(t))return skipSn();return edit('sn')}
 if(stage==='phone'){if(/^1[3-9]\d{9}$/.test(t)){d.phone=t;return confirmPhone()}return edit('phone')}
 if(stage==='impact'&&impacts.includes(t))return setImpact(impacts.indexOf(t));
 if(stage==='category'||stage==='desc'||stage==='confirm'){d.desc=t.slice(0,100);if(!d.group){let found=devices.filter(x=>t.includes(x));if(found.length){setCategory(IT);candidates=[...found,...devices.filter(x=>!found.includes(x))]}else if(/冷柜|照明|插座|招牌/.test(t)){setCategory('工程类');candidates=groups['工程类'].filter(x=>/柜|照明|插座|门头/.test(x))}}answer('描述故障现象',t);return}toast('请先选择当前卡片中的选项')}
function submitOrder(){if(!(page==='form'||page==='review'||page==='chat'&&chatStage()==='confirm')||missing())return;const {group,leaf,desc,phone,person,date,photos}=d;const row={group,leaf,desc:desc.trim(),phone,person,date,visit:d.visit,impact:d.impact,photos:[...photos],...(isIT()?{sn:d.sn.trim()}:{}),id:'BX-'+Date.now().toString(36).toUpperCase(),status:isIT()?'待运维受理':'待派单',events:[isIT()?'已提交至运维受理队列':'已提交至原报修流程']};records.unshift(row);storeLocal('records',records);active=row.id;d=newDraft();candidates=[];if(mode==='form'){formDraft=d;storeLocal('draft',d)}showPage('result');$('resultBody').innerHTML='<div class="fields success"><div class="success-icon">✓</div><h3>报修提交成功</h3><div class="number">报修单号<br><strong>'+row.id+'</strong></div><span class="pill doing">'+row.status+'</span><div class="actions">'+action('查看报修记录',"showPage('records')",'primary')+action('回到服务助手',"showPage('home')")+'</div></div>'}
function renderRecords(){const tabs=['全部','处理中','已完成'];document.querySelector('.tabsbar').innerHTML=tabs.map((t,i)=>action(t,"tab='"+t+"';renderRecords()",'stab '+(tab===t?'active':''))).join('');const list=records.filter(r=>tab==='全部'||(tab==='已完成')===(r.status==='已完成'));$('recList').innerHTML=list.map(r=>'<button class="rec" onclick="openRecord(\''+r.id+'\')"><span class="rrow"><b>'+esc(r.id)+'</b><span class="pill '+(r.status==='已完成'?'ok':'doing')+'">'+esc(r.status)+'</span></span><span class="meta">'+esc([r.group,r.leaf].filter(Boolean).join(' › '))+'</span>'+esc(r.desc)+'</button>').join('')||'<p class="mfoot">暂无该状态的报修记录</p>'}
function openRecord(id){active=id;showPage('detail')}
function detail(){const r=records.find(x=>x.id===active);$('detailHead').innerHTML='<h2>'+esc(r.id)+'</h2><span class="pill">'+esc(r.status)+'</span>';$('detailBody').innerHTML='<div class="sectionlabel">处理进度</div><div class="tl">'+r.events.map((e,i)=>'<div class="tl-item '+(i===r.events.length-1&&r.status!=='已完成'?'doing':'done')+'"><span class="tl-dot"></span><span class="tlabel">'+esc(e)+'</span></div>').join('')+'</div><div class="sectionlabel">报修信息</div>'+rows(confirmRows(r));$('detailFoot').innerHTML=r.status==='待验收'?action('仍有问题','accept(false)')+action('已试用，确认恢复','accept(true)','primary'):action('返回列表',"showPage('records')",'primary')}
function accept(ok){const r=records.find(x=>x.id===active);if(r.status!=='待验收')return;r.status=ok?'已完成':'运维处理中';r.events.push(ok?'现场联系人确认设备恢复使用':'门店反馈仍有问题，原单回到运维队列');storeLocal('records',records);detail()}
showPage('form');
</script></body></html>
