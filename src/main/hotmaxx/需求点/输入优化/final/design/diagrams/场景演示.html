function hit(chg,p){return chg.some(c=>p===c||p.startsWith(c+".")||p.startsWith(c+"["))}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function scalar(v){return v===null||typeof v!=="object"}
function jline(txt,red){return red?'<span class="chg">'+txt+'</span>':txt}
function rObj(o,path,chg,ind,lines){
 const keys=Object.keys(o);
 if(keys.length&&keys.every(k=>scalar(o[k]))&&JSON.stringify(o).length<=110){
  lines.push(ind+"{"+keys.map(k=>jline(JSON.stringify(k)+": "+JSON.stringify(o[k]),hit(chg,path?path+"."+k:k))).join(", ")+"}");return}
 lines.push(ind+"{");
 keys.forEach((k,i)=>{const p=path?path+"."+k:k;const ind2=ind+"  ";
  const ls=rVal(o[k],p,chg,ind2);
  ls[0]=ind2+jline(JSON.stringify(k)+": ",hit(chg,p))+ls[0].slice(ind2.length);
  if(i<keys.length-1)ls[ls.length-1]+=",";
  lines.push(...ls)});
 lines.push(ind+"}")}
function rArr(a,path,chg,ind,lines){
 if(!a.length){lines.push(ind+"[]");return}
 if(a.every(scalar)){lines.push(ind+"["+a.map(v=>jline(JSON.stringify(v),hit(chg,path))).join(", ")+"]");return}
 lines.push(ind+"[");
 a.forEach((v,i)=>{const p=path+"["+i+"]";const ind2=ind+"  ";
  const ls=rVal(v,p,chg,ind2);
  if(hit(chg,p))ls[0]='<span class="chg">'+ls[0]+'</span>';
  if(i<a.length-1)ls[ls.length-1]+=",";
  lines.push(...ls)});
 lines.push(ind+"]")}
function rVal(v,p,chg,ind){
 if(v===null||v===undefined)return[ind+"null"];
 if(Array.isArray(v)){const l=[];rArr(v,p,chg,ind,l);return l}
 if(typeof v==="object"){const l=[];rObj(v,p,chg,ind,l);return l}
 return[ind+JSON.stringify(v)]}
function renderJSON(state,chg){
 const lines=[];rObj(state,"",chg,"",lines);
 return lines.join("\n")}

const SNAP={};
function build(){
 SCEN.forEach(sc=>{
  const pre=(sc.steps.find(s=>s.pre==="A"))?null:null;
  let S=null;
  const steps=[];
  sc.steps.forEach((st,idx)=>{
   if(st.pre==="A"){const n=(st.v==="v5")?5:8;S=initialState();SCEN[0].steps.slice(0,n).forEach(s=>s.mut(S));S=JSON.parse(JSON.stringify(S));}
   else if(S===null){S=initialState()}
   else{S=JSON.parse(JSON.stringify(S))}
   st.mut(S);
   steps.push({meta:st,snap:JSON.parse(JSON.stringify(S))});
  });
  SNAP[sc.id]=steps;
 });
}
