const uuid=()=>globalThis.crypto?.randomUUID?.()||'demo-'+Date.now()+'-'+Math.random().toString(16).slice(2);

let drafts={},records=[],toastTimer;

function load(){
  records=seed();
  try{
    const data=JSON.parse(localStorage.getItem(KEY)||'null');
    if(data?.version===2){
      records=Array.isArray(data.records)?data.records:records;
      drafts=data.drafts||{};
      Object.keys(drafts).forEach(k=>{if(!drafts[k].savedAt||Date.now()-drafts[k].savedAt>7*DAY)delete drafts[k];});
      Object.values(drafts).forEach(d=>(d.photos||[]).forEach(p=>{if(!p.demo){delete p.url;p.missing=true;}}));
    }
  }catch{}
}
function persist(){try{
  const strip=p=>{const {url,...rest}=p;return rest;};
  const savedDrafts=Object.fromEntries(Object.entries(drafts).map(([k,d])=>[k,{...d,photos:d.photos.map(strip)}]));
  localStorage.setItem(KEY,JSON.stringify({version:2,drafts:savedDrafts,records:records.map(r=>({...r,photos:r.photos.map(strip)}))}));
}catch{toast('本地存储不可用，内容仅保留在本次页面');}}
function store(){return STORE_LIST.find(s=>s.id===state.storeId);}
function storeName(id=state.storeId){const s=STORE_LIST.find(s=>s.id===id);return s?s.id+' '+s.name:'门店不可用';}
function draftKey(){return [USER.id,state.storeId,state.mode].join(':');}
function draft(){const key=draftKey();return drafts[key]||(drafts[key]={category:'',detail:'',raw:'',parsed:false,expected:'',impact:'',phone:USER.phone,photos:[],savedAt:Date.now(),requestId:uuid()});}
function saveDraft(){draft().savedAt=Date.now();persist();}
function changed(){draft().requestId=uuid();saveDraft();}
function toast(text){$('#toast').textContent=text;$('#toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.display='none',3000);}
function openModal(title,html){$('#modalContent').innerHTML='<div class="modal-close"><h3>'+esc(title)+'</h3><button aria-label="关闭" onclick="closeModal()">×</button></div>'+html;if(!$('#modal').open)$('#modal').showModal();}
function closeModal(){$('#modal').close();}
function navigate(page){
  if(['create','review'].includes(state.page)&&page!==state.page){
    openModal('本次报修还没完成','<p class="demo-info">两种填报方式分别保存草稿，保留 7 天。</p><div class="demo-grid"><button onclick="closeModal()">继续填写</button><button onclick="saveDraft();closeModal();direct(\''+page+'\')">保存草稿并离开</button><button onclick="discardAndGo(\''+page+'\')" style="color:#b15f55">放弃当前方式的草稿</button></div>');return;
  }
  direct(page);
}
function discardAndGo(page){delete drafts[draftKey()];persist();closeModal();direct(page);}
function direct(page){
  if(state.page==='list')state.listScroll=$('#scroll')?.scrollTop||0;
  state.page=page;render();
}
function goBack(){if(state.page==='detail'){direct(state.detailOrigin);return;}if(state.page==='review'){direct('create');return;}if(state.page==='success'||state.page==='pending'){direct('list');return;}if(state.page==='home'){toast('当前为 App 服务助手演示首页');return;}navigate('home');}
function context(){return '<div class="storebar"><div><strong>⌖ '+esc(storeName())+'</strong><small>当前员工：'+esc(USER.name)+' · '+(state.page==='list'?'本门店所有人的报修记录':'门店及报修人自动带出')+'</small></div><button class="textbtn" onclick="storePicker()">切换门店</button></div>';}
function tabs(){return '<div class="tabs"><button class="'+(['create','review'].includes(state.page)?'active':'')+'" onclick="navigate(\'create\')">新建报修</button><button class="'+(['list','detail'].includes(state.page)?'active':'')+'" onclick="navigate(\'list\')">本店记录</button></div>';}
function render(){
  const title={home:'服务助手',create:'门店报修',review:'核对报修单',list:'本店报修记录',detail:'报修详情',success:'提交结果',pending:'确认提交结果'};
  $('#navTitle').textContent=title[state.page]||'门店报修';
  document.querySelectorAll('.step').forEach(e=>e.classList.toggle('active',e.dataset.step===state.page||(e.dataset.step==='create'&&['review','success','pending'].includes(state.page))));
  if(state.noAccess){$('#screen').innerHTML='<div class="scroll content">'+empty('⌖','暂未绑定可报修门店','请联系门店管理员维护门店权限。','恢复演示权限','restoreDemo()')+'</div>';return;}
  if(state.page==='home'){renderHome();return;}
  if(state.page==='create'){renderCreate();return;}
  if(state.page==='review'){renderReview();return;}
  if(state.page==='list'){renderList();return;}
  if(state.page==='detail'){renderDetail();return;}
  if(state.page==='success'){renderSuccess();return;}
  if(state.page==='pending'){renderPending();return;}
}

  $('#screen').innerHTML='<div class="scroll subtle"><div class="home-hero"><div class="brandline"><strong>⌖ '+esc(storeName())+'</strong><button class="textbtn" onclick="storePicker()">切换</button></div><span class="mode-badge">HOTMAXX · 门店服务</span><h2>Hi～'+esc(USER.name)+'</h2><p>从发起报修，到跟进处理，都在这里。</p></div><div class="home-cards"><article class="home-card main"><h3>⚒ 我要报修</h3><p>故障随时反馈，处理进度随时查看。</p><div class="actions"><button class="primary" onclick="direct(\'create\')">新建报修 →</button><button class="textbtn" onclick="direct(\'list\')">历史记录 ›</button></div></article><article class="home-card"><h3 style="font-size:15px">本店报修，一起跟进</h3><p style="margin-bottom:0">同门店员工可查看本店全部报修记录，<br>交接班也能接着处理。</p></article></div><div class="service-note">交互演示 · 门店与员工信息为示例。<br>本页仅展示本次报修相关入口。</div></div>';

  if(state.pending)return direct('pending');

}
function readonlyFields(){return '<div class="section-title">基础信息</div>'+row('门店名称',storeName())+categoryField()+row('报修人员',USER.name)+row('报修日期',dayOf(new Date()).replaceAll('-','/'));}

function editableFields(){const d=draft();return '<div class="field"><label class="req" for="description">描述具体故障</label><textarea id="description" placeholder="请描述故障现象、发生时间、影响范围等…" oninput="detailInput(this.value)">'+esc(d.detail)+'</textarea><span class="count" id="charCount">'+Array.from(d.detail).length+'/100</span></div><div class="field"><label class="req">现场照片（3MB 以内）</label><div id="photos">'+photosHTML(d.photos,true)+'</div><p class="hint">1～6 张，每张不超过 3MB；支持 JPEG / PNG / WebP</p><button class="textbtn" onclick="addDemoPhoto()">＋ 使用演示附件</button></div><div class="section-title">期望处理</div><div class="field"><label class="req" for="expected">期望上门</label><input id="expected" type="datetime-local" min="'+shanghai().replace(' ','T')+'" value="'+esc(d.expected)+'" onchange="fieldChange(\'expected\',this.value)"><p class="hint">演示采用日期时间；期望时间以门店意愿为准，实际安排请查看进度。</p></div><div class="field"><label class="req">影响营业</label><div class="choice-row"><label><input type="radio" name="impact" value="yes" '+(d.impact==='yes'?'checked':'')+' onchange="fieldChange(\'impact\',this.value)">是</label><label><input type="radio" name="impact" value="no" '+(d.impact==='no'?'checked':'')+' onchange="fieldChange(\'impact\',this.value)">否</label></div></div><div class="field"><label class="req" for="phoneInput">联系电话</label><input id="phoneInput" type="tel" inputmode="tel" maxlength="20" value="'+esc(d.phone)+'" placeholder="请输入联系电话" oninput="fieldChange(\'phone\',this.value)"><p class="hint">可修改联系电话；报修人员始终保留为当前员工。</p></div>';}
function renderCreate(){
  if(state.pending){direct('pending');return;}
  const d=draft(),isAI=state.mode==='ai';
  const ai='<div class="mode-head"><h2>AI 报修助手</h2><button class="textbtn" onclick="setMode(\'form\')">⇄ 传统表单</button></div><div class="ai-intro"><div class="avatar">✦</div><div class="bubble"><p>'+esc(USER.name)+'你好！门店信息已带出。</p><p>哪里出了问题？描述<strong>故障现象、发生时间和影响</strong>，知道多少说多少。</p><div class="quickgrid">'+['冷柜不制冷','照明灯故障','水管漏水','货架损坏'].map((v,i)=>'<button class="quick" onclick="quick('+i+')">'+v+'</button>').join('')+'</div></div></div><label for="raw" class="tiny muted">先说说问题</label><textarea id="raw" placeholder="例如：冷柜从上午开始不制冷，饮料不够凉…" oninput="fieldChange(\'raw\',this.value)">'+esc(d.raw)+'</textarea><div class="actions" style="justify-content:space-between"><button class="textbtn" onclick="voiceSample()">♩ 模拟语音输入</button><button class="primary" onclick="parseAI()">'+(d.parsed?'重新整理描述':'整理报修信息')+'</button></div>';
  $('#screen').innerHTML=context()+tabs()+'<div id="scroll" class="scroll"><div class="content">'+(isAI?ai:'<h2>创建报修记录</h2><p class="intro">填写故障信息，我们来跟进处理。</p><button class="entry" onclick="setMode(\'ai\')"><span class="spark">✦</span><span><strong>AI 助手填报</strong><small>描述问题，帮你整理报修单</small></span><span class="arrow">›</span></button>')+(isAI&&!d.parsed?'<div class="ai-note">整理后，请确认类别并补齐照片、上门时间、营业影响和电话。AI 不会自动提交。</div>':(isAI?'<div class="ai-note" id="aiFields">已整理为草稿，请选择正确类别并补齐下面的信息。</div>':'')+readonlyFields()+editableFields())+'<div id="validation" class="validation" role="alert"></div><span class="drafttag">'+(d.detail||d.raw?'已保存当前方式草稿 · 7 天内可继续':'两种方式草稿独立 · 切换不会互相覆盖')+'</span></div></div><footer class="footer"><button onclick="saveDraft();toast(\'当前门店草稿已保存\')">▣ 存草稿</button><button class="primary" onclick="review()">核对并提交</button></footer><div class="bottom-note">交互演示 · 不会提交到真实业务系统</div>';
}
function fieldChange(key,value){draft()[key]=value;changed();}
function detailInput(value){fieldChange('detail',value);const n=Array.from(value).length;$('#charCount').textContent=n+'/100';$('#charCount').classList.toggle('counter-error',n>100);}
const examples=['冷柜从上午开始不制冷，柜内饮料温度偏高，已暂停使用。','收银台旁照明灯闪烁，其他区域照明正常。','洗手池下方水管漏水，地面已经积水。','货架固定件松动，需要重新加固。'];
function quick(i){draft().raw=examples[i];changed();render();$('#raw').focus();}
function voiceSample(){draft().raw=examples[0];changed();render();toast('已模拟语音转文字，请核对后整理');}
function parseAI(){
  const d=draft();if(!d.raw.trim())return toast('请先描述故障');
  if(state.aiUnavailable)return setMode('ai');
  d.detail=d.raw.trim();d.parsed=true; // 演示保留原文，避免凭空补充原因或影响。
  if(!d.category)d.category=/货架|用具/.test(d.raw)?'营运用具类':/冷柜|灯|水管/.test(d.raw)?'工程类':'';
  changed();render();$('#aiFields')?.scrollIntoView({block:'start'});toast('已生成演示草稿，类别仍需你核对');
}
function pickPhoto(){$('#file').value='';$('#file').click();}
$('#file').addEventListener('change',()=>{
  const d=draft();let rejects=0;
  for(const f of $('#file').files){if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>MAX_PHOTO||d.photos.length>=MAX_COUNT){rejects++;continue;}d.photos.push({id:uuid(),name:f.name,size:f.size,type:f.type,url:URL.createObjectURL(f)});}
  changed();$('#photos').innerHTML=photosHTML(d.photos,true);toast(rejects?'部分照片不符合格式、大小或数量要求，已跳过':'照片已添加');
});
function addDemoPhoto(){const d=draft();if(d.photos.length>=MAX_COUNT)return toast('最多 6 张照片');d.photos.push({id:uuid(),name:'故障现场（演示附件）',demo:true});changed();$('#photos').innerHTML=photosHTML(d.photos,true);}
function removePhoto(i){const [p]=draft().photos.splice(i,1);if(p?.url)URL.revokeObjectURL(p.url);changed();$('#photos').innerHTML=photosHTML(draft().photos,true);}
function currentRecord(){return records.find(r=>r.id===state.selected&&r.storeId===state.storeId&&!state.noAccess);}
function previewPhoto(index,readOnly){
  const ps=readOnly&&state.page==='detail'?currentRecord()?.photos:draft().photos,p=ps?.[index];if(!p)return;
  openModal('现场照片',p.url?'<img class="photo-preview" src="'+esc(p.url)+'" alt="'+esc(p.name)+'"><p class="demo-info">'+esc(p.name)+'</p>':'<div class="empty"><div class="empty-symbol">▧</div><h3>'+esc(p.demo?'演示附件':'照片需重新上传')+'</h3><p>'+esc(p.demo?'用于体验上传与查看流程，无真实现场图片。':'原型未持久化图片内容；生产由附件服务提供。')+'</p></div>');
}
function validate(d){
  if(state.noAccess||!store())return '暂无有效门店权限';
  if(!CATEGORIES.includes(d.category))return '请选择报修类别';
  const len=Array.from(d.detail.trim()).length;if(!len||len>100)return '故障描述需填写 1～100 字，请核对';
  if(!d.photos.length||d.photos.some(p=>p.missing))return '请至少上传一张有效照片，失效照片请重新上传';
  if(d.photos.length>MAX_COUNT||d.photos.some(p=>p.size>MAX_PHOTO))return '照片最多 6 张，单张不能超过 3MB';
  if(!d.expected||!Number.isFinite(new Date(d.expected+':00+08:00').getTime())||new Date(d.expected+':00+08:00').getTime()<=Date.now())return '请选择晚于当前时间的期望上门时间';
  if(!['yes','no'].includes(d.impact))return '请明确选择是否影响营业';
  if(!/^1[3-9]\d{9}$/.test(d.phone.trim()))return '请填写有效的 11 位手机号（演示校验）';
  return '';
}
function review(){if(state.mode==='ai'&&!draft().parsed)return toast('请先整理报修信息');const error=validate(draft());if(error){$('#validation').textContent=error;$('#validation').scrollIntoView({block:'center'});return;}saveDraft();direct('review');}
function submittedFields(d,reporter=USER.name,storeId=state.storeId,date=dayOf(new Date())){return row('门店名称',storeName(storeId))+row('报修类别',d.category)+row('报修人员',reporter)+row('报修日期',date)+row('联系电话',d.phone)+row('期望上门',d.expected.replace('T',' '))+row('影响营业',d.impact==='yes'?'是':'否')+'<div class="sectionlabel">描述具体故障</div><p>'+esc(d.detail)+'</p><div class="sectionlabel">现场照片 · '+d.photos.length+' 张</div>'+photosHTML(d.photos);}
function renderReview(){const d=draft();$('#screen').innerHTML=context()+'<div id="scroll" class="scroll"><div class="content"><div class="summary-banner"><h3>请再核对一下</h3><p>确认门店、故障和联系方式，提交后即可跟进进度。</p></div><div class="detail-box">'+submittedFields(d)+'</div><div class="notice">期望上门是你的需求，实际安排请查看后续处理进度。</div><div id="validation" class="validation" role="alert"></div></div></div><footer class="footer"><button onclick="direct(\'create\')">返回修改</button><button id="submitBtn" class="primary" onclick="submitRepair()">确认提交报修</button></footer>';}
function submitRepair(){
  if(state.pending)return direct('pending');
  const d=draft(),error=validate(d);if(error){$('#validation').textContent=error;return;}
  $('#submitBtn').disabled=true;
  state.pending={key:draftKey(),storeId:state.storeId,mode:state.mode,data:structuredClone(d)};
  if(state.pendingNext){state.pendingNext=false;direct('pending');return;}
  finishSubmission();
}
function finishSubmission(){
  if(!state.pending)return;
  const p=state.pending;
  let r=records.find(x=>x.requestId===p.data.requestId);
  if(!r){r={...p.data,id:uuid(),number:'BX-DEMO-'+dayOf(new Date()).replaceAll('-','')+'-'+String(records.filter(r=>r.requestId).length+1).padStart(3,'0'),storeId:p.storeId,reporter:USER.name,reporterId:USER.id,status:'wait',sourceStatus:'待受理',source:p.mode,created:new Date().toISOString(),updated:new Date().toISOString(),timeline:[{title:'报修已提交',at:new Date().toISOString(),note:'已收到报修信息，等待受理。'}]};records.unshift(r);}
  delete drafts[p.key];state.success=r.id;state.selected=r.id;state.pending=null;state.emptyDemo=false;state.queryError=false;state.keyword='';state.status='all';state.range='all';state.listScroll=0;persist();direct('success');
}
function renderPending(){$('#screen').innerHTML=context()+'<div class="scroll"><div class="success-wrap"><div class="success-icon pending-icon">…</div><h2>正在确认提交结果</h2><p>已保留本次报修信息，请勿重复新建同一故障。</p><div class="success-card"><span class="tiny muted">请求已发出 · 结果待核验</span><strong>等待结果确认</strong><span class="demo-info">正在确认是否已生成工单，确认后可查看详情。</span></div><button class="primary full" onclick="finishSubmission()">查询提交结果（演示成功）</button><button class="outline full" onclick="direct(\'list\')">先查看本店记录</button><p>此处模拟提交超时后的结果核验，不会重新创建。</p></div></div>';}
function renderSuccess(){const r=records.find(x=>x.id===state.success&&x.storeId===state.storeId);if(!r)return direct('list');$('#screen').innerHTML=context()+'<div class="scroll"><div class="success-wrap"><div class="success-icon">✓</div><h2>报修提交成功</h2><p>已收到报修信息，可随时查看处理进度。</p><div class="success-card"><span class="tiny muted">报修单编号</span><strong>'+esc(r.number)+'</strong>'+badge(r)+'<p style="margin:12px 0 0">'+esc(fmt(r.created))+' · '+esc(r.reporter)+'</p></div><button class="primary full" onclick="openDetail(\''+r.id+'\',\'success\')">查看本单进度</button><button class="outline full" onclick="direct(\'list\')">本店全部记录</button><button class="textbtn full" onclick="direct(\'create\')">再报修一单</button><p>演示结果 · 未创建真实工单</p></div></div>';}
function badge(r){return '<span class="badge '+esc(r.status)+'">'+esc(STATUS[r.status]||STATUS.unknown)+'</span>';}
function recordsForStore(){return state.noAccess||state.emptyDemo?[]:records.filter(r=>r.storeId===state.storeId);}
function filteredRecords(){const q=state.keyword.trim().toLocaleLowerCase();const today=dayOf(new Date());const from=state.range==='all'?null:dayOf(new Date(Date.now()-(Number(state.range)-1)*DAY));return recordsForStore().filter(r=>(state.status==='all'||r.status===state.status)&&(!q||(r.number+' '+r.detail).toLocaleLowerCase().includes(q))&&(!from||(dayOf(new Date(r.created))>=from&&dayOf(new Date(r.created))<=today))).sort((a,b)=>new Date(b.created)-new Date(a.created)||b.id.localeCompare(a.id));}
function empty(symbol,title,text,action,handler){return '<div class="empty"><div class="empty-symbol">'+symbol+'</div><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p><button class="primary" onclick="'+handler+'">'+esc(action)+'</button></div>';}
function renderList(){
  const all=recordsForStore(),rs=filteredRecords(),hasFilters=state.keyword||state.status!=='all'||state.range!=='all';
  let body=state.queryError?empty('↻','暂时无法获取报修记录','请求失败，请稍后重试。','重新加载','state.queryError=false;render()'):rs.length?'<div class="record-list">'+rs.slice(0,state.limit).map(r=>'<button class="record" onclick="openDetail(\''+esc(r.id)+'\')"><div class="record-top"><strong>'+esc(r.number)+'</strong>'+badge(r)+'</div><h3>'+esc(r.detail)+'</h3><div class="record-meta"><span>'+esc(r.category)+'</span><span>'+esc(fmt(r.created))+'</span></div><div class="record-foot"><span>报修人：'+esc(r.reporter)+'</span><span class="'+(r.impact==='yes'?'impact':'')+'">'+(r.impact==='yes'?'影响营业':'不影响营业')+'　›</span></div></button>').join('')+'</div>'+(rs.length>state.limit?'<button class="outline full loadmore" onclick="loadMore()">加载更多</button>':'<p class="hint" style="text-align:center;margin-top:18px">已显示全部 '+rs.length+' 条记录</p>'):hasFilters?empty('⌕','没有找到符合条件的记录','试试其他关键词，或清除筛选条件。','清除条件','clearFilters()'):empty('▤','本店暂无报修记录','有设备或设施问题，可在这里发起报修。','新建报修','direct(\'create\')');
  $('#screen').innerHTML=context()+tabs()+'<div id="scroll" class="scroll subtle"><div class="content"><div class="list-head"><h2>本店记录</h2><button class="textbtn" onclick="refreshList()">↻ 刷新</button></div><p class="intro-tight">查看本门店所有人的报修记录</p>'+(state.pending?'<div class="notice">有一笔报修正在确认提交结果。<button class="textbtn" onclick="direct(\'pending\')">查看结果 ›</button></div>':'')+(!state.queryError?'<div class="stats"><div class="stat"><b>'+all.length+'</b><span>本店全部</span></div><div class="stat"><b>'+all.filter(r=>r.status==='wait').length+'</b><span>待受理</span></div><div class="stat"><b>'+all.filter(r=>r.status==='work').length+'</b><span>处理中</span></div></div>':'')+'<form class="search-row" onsubmit="event.preventDefault();searchRecords()"><input id="search" aria-label="搜索工单" placeholder="输入工单编号或故障内容" value="'+esc(state.keyword)+'"><button class="primary">搜索</button></form><div class="filter-row"><select aria-label="按状态筛选" onchange="setFilter(\'status\',this.value)"><option value="all">全部状态</option>'+Object.entries(STATUS).map(([key,label])=>'<option value="'+key+'" '+(key===state.status?'selected':'')+'>'+label+'</option>').join('')+'</select><select aria-label="按时间筛选" onchange="setFilter(\'range\',this.value)">'+[['all','全部时间'],['7','近 7 天'],['30','近 30 天']].map(([k,l])=>'<option value="'+k+'" '+(state.range===k?'selected':'')+'>'+l+'</option>').join('')+'</select></div><div class="results-label"><span>'+(state.queryError?'等待重试':'符合条件 '+rs.length+' 条 · 提交时间倒序')+'</span>'+(hasFilters?'<button class="textbtn" onclick="clearFilters()">清除条件</button>':'')+'</div>'+body+'</div></div>';
  $('#scroll').scrollTop=state.listScroll;
}
function searchRecords(){state.keyword=$('#search').value.trim();state.limit=20;state.listScroll=0;render();}
function setFilter(k,v){state[k]=v;state.limit=20;state.listScroll=0;render();}
function clearFilters(){state.keyword='';state.status='all';state.range='all';state.listScroll=0;state.limit=20;render();}
function loadMore(){state.listScroll=$('#scroll').scrollTop;state.limit+=20;render();}
function refreshList(){state.queryError=false;state.listScroll=$('#scroll').scrollTop;render();toast('已刷新当前门店记录（演示）');}
function openDetail(id,origin='list'){if(state.noAccess)return;const r=records.find(x=>x.id===id&&x.storeId===state.storeId);if(!r){toast('该记录不存在或当前无权查看');return;}state.selected=id;state.detailOrigin=origin;direct('detail');}
function renderDetail(){const r=currentRecord();if(!r){$('#screen').innerHTML='<div class="scroll content">'+empty('⌖','该记录不存在或当前无权查看','请返回本店记录重新选择。','返回记录','direct(\'list\')')+'</div>';return;}$('#screen').innerHTML=context()+'<div id="scroll" class="scroll"><div class="content"><button class="textbtn backline" onclick="direct(\''+state.detailOrigin+'\')">‹ '+(state.detailOrigin==='success'?'返回提交结果':'返回本店记录')+'</button><div class="summary-banner"><div class="record-top"><strong>'+esc(r.number)+'</strong>'+badge(r)+'</div><h3>'+esc(r.sourceStatus)+'</h3><p>来源更新时间：'+esc(fmt(r.updated))+'</p></div><div class="detail-box"><h3>处理进度</h3><div class="timeline">'+(r.timeline?.length?r.timeline.map(e=>'<div class="event"><strong>'+esc(e.title)+'</strong><time>'+esc(fmt(e.at))+'</time><p>'+esc(e.note)+'</p></div>').join(''):'<p class="muted">暂无可展示的过程记录</p>')+'</div></div>'+(r.note?'<div class="detail-box"><h3>处理说明</h3><p>'+esc(r.note)+'</p></div>':'')+'<div class="detail-box"><h3>报修信息</h3>'+submittedFields(r,r.reporter,r.storeId,dayOf(new Date(r.created)))+'</div><p class="hint">期望上门不代表实际安排。进度以处理记录为准。</p></div></div><footer class="footer"><button onclick="direct(\'list\')">本店记录</button><button class="primary" onclick="refreshDetail()">↻ 刷新进度</button></footer>';}
function refreshDetail(){if(!currentRecord())return render();render();toast('已获取最新演示数据，当前进度未变化');}
function demoDetail(){if(['create','review'].includes(state.page))saveDraft();const r=recordsForStore()[0];if(r)openDetail(r.id);else direct('list');}
function storePicker(){if(state.pending)return openModal('请先确认提交结果','<p class="demo-info">当前报修结果尚未明确，先核验结果后再切换门店。</p><button class="primary full" onclick="closeModal();direct(\'pending\')">查看提交结果</button>');openModal('选择授权门店','<p class="demo-info">这里只展示当前员工有权限的门店。切店后重新加载该店记录和草稿。</p><div class="demo-grid">'+STORE_LIST.map(s=>'<button onclick="switchStore(\''+s.id+'\')">'+(s.id===state.storeId?'✓ ':'⌖ ')+esc(s.id+' '+s.name)+'</button>').join('')+'</div>');}
function switchStore(id){if(!STORE_LIST.some(s=>s.id===id)||state.noAccess)return;const same=state.storeId===id;if(['create','review'].includes(state.page))saveDraft();closeModal();if(same)return;state.storeId=id;state.keyword='';state.status='all';state.range='all';state.limit=20;state.selected=null;state.success=null;state.listScroll=0;state.emptyDemo=false;state.queryError=false;if(['detail','success','pending'].includes(state.page))state.page='list';if(state.page==='review')state.page='create';render();toast('已切换至 '+storeName());}
function demoMenu(){openModal('原型演示选项','<p class="demo-info">本地模拟，不连接明道云。类别与状态仅供评审。选择下方场景继续体验。</p><div class="demo-grid"><button onclick="closeModal();state.queryError=true;direct(\'list\')">模拟：记录查询失败</button><button onclick="closeModal();state.emptyDemo=true;state.queryError=false;clearFilters();direct(\'list\')">模拟：本店暂无记录</button><button onclick="closeModal();state.noAccess=true;render()">模拟：没有门店权限</button><button onclick="closeModal();state.pendingNext=true;direct(\'create\');toast(\'下次提交将进入结果核验\')">模拟：下次提交结果待确认</button><button onclick="closeModal();state.aiUnavailable=true;state.page=\'create\';setMode(\'ai\')">模拟：AI 助手不可用</button><button onclick="closeModal();restoreDemo()">恢复正常场景（保留草稿与记录）</button></div>');}
function restoreDemo(){state.noAccess=false;state.emptyDemo=false;state.queryError=false;state.aiUnavailable=false;state.pendingNext=false;state.page=state.pending?'pending':'home';render();toast('已恢复正常演示');}
load();render();
</script>
</body>
</html>
