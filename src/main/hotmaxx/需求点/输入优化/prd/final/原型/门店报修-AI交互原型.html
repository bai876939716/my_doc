-radius:9px;padding:12px 18px;font-weight:600}.footer .primary{flex:1}.chathead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}.chathead strong{font-size:16px}.chathead small{display:block;color:#99a3b0;font-size:10px}.chathead button{margin-left:auto}.context{background:#f7faff;padding:11px 18px;border-bottom:1px solid #e5edf8;font-size:11px;color:#67809e;display:flex;justify-content:space-between;gap:10px}.context strong{font-size:12px;color:#385679;display:block}.chatbody{background:var(--bg);padding:18px 16px}.date{text-align:center;color:#a2aebb;font-size:10px;margin-bottom:18px}.msg{display:flex;gap:8px;margin:16px 0;align-items:flex-start}.avatar{width:28px;height:28px;background:#e4edff;color:var(--blue);border-radius:9px;display:grid;place-items:center;flex-shrink:0;font-weight:700;font-size:16px}.bubble{max-width:calc(100% - 35px);background:white;border:1px solid var(--line);padding:12px 14px;border-radius:3px 13px 13px;font-size:13px;line-height:1.8;min-width:0}.msg.user{justify-content:flex-end}.user .bubble{background:var(--blue);color:white;border:0;border-radius:13px 3px 13px 13px}.bubble p{margin:0 0 8px}.bubble p:last-child{margin:0}.bubble small{color:#8e9cac;font-size:11px}.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.quick{border:1px solid #e3e9f2;border-radius:8px;padding:12px 7px;text-align:left;font-size:11px;background:#fbfcff}.quick i{display:block;font-style:normal;font-size:20px;margin-bottom:4px}.options{display:grid;gap:8px;margin-top:12px}.option{border:1px solid #dfe6f0;text-align:left;border-radius:8px;padding:10px;font-size:12px;background:#fff}.option:first-child{border-color:#bfd7ff;background:#f5f9ff;color:#266cc9}.option small{display:block}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:12px}.composer{background:white;padding:10px 15px 14px;border-top:1px solid var(--line)}.composer-tools{display:flex;gap:12px </style></head><body><main class="layout"><aside class="aside"><div class="brand"><span class="brandmark">好特卖</span><span>HOTMAXX</span></div><div class="eyebrow">STORE SERVICE / 门店服务</div><h1>报修，说清楚<br>就能填好。</h1><p>保留熟悉的表单，让 AI 帮你整理。<br>从一句描述，到一张待确认的报修单。</p><div class="steps"><div class="step active" data-step="0"><b>1</b>选择填报方式</div><div class="step" data-step="1"><b>2</b>描述问题 · 补充信息</div><div class="step" data-step="2"><b>3</b>核对预填报修单</div><div class="step" data-step="3"><b>4</b>确认提交</div></div><div class="demo-tools"><span style="font-size:11px;color:#9ca6b3">交互原型 · 所有数据均为演示</span><button onclick="resetAI()">↺ 重新演示 AI 对话</button><button onclick="unavailable()">⚙ 模拟 AI 服务不可用</button></div></aside><section class="phone"><div class="statusbar"><b>9:41</b><span>▮▮▮  Wi-Fi  ▰</span></div><nav class="nav"><button aria-label="返回表单" onclick="showPage('form')">‹</button><span>门店报修</span><button aria-label="演示选项" onclick="demoMenu()">···</button></nav><div id="form" class="page visible"><div class="scroll"><div class="formhead"><h2>创建报修记录</h2><span class="tab">▣ 详情</span></div><button class="entry" onclick="enterAI()"><span class="spark">✦</span><span><strong>AI 助手填报</strong><small>描述问题，自动整理报修单</small></span><span class="arrow">↗</span></button><form id="traditional" class="fields"><div class="field"><label>报修单编号</label><span class="dash">—</span></div><div class="field"><label>报修单状态</label><div class="status"><span class="pill">● 待提交</span></div></div><div class="field"><label class="req">报修类别</label><select name="category" required><option value="">请选择</option>制冷设备 - 风幕柜/立式冷柜</option><option>制冷设备 - 卧式冰柜</option><option>暖通设备 - 门店空调</option><option>收银设备 - 收银机/扫码枪</option><option>照明设备 - 照明/招牌灯</option><option>物料质量 - 购物袋</option><option>水电设施 - 给排水</option><option>门店设施 - 货架/门锁</option><option>其他</option></select><p class="hint">请准确选择。特别紧急要慎重！选错会被驳回重提！</p></div><div class="field"><label class="req">门店地址</label><input name="address" required placeholder="请填写文本内容"></div><div class="field"><label class="req">问题照片或视频</label><div class="uploads"><button type="button" class="outline" onclick="upload('form')">♧ 添加附件</button><button type="button" class="outline" onclick="upload('form')">◎ 拍照</button><button type="button" class="outline" onclick="upload('form')">▣ 拍摄</button></div><div id="formFiles"></div><p class="hint">若提报类别为“购物袋”，请拍摄袋子底部供应商以及问题部位。</p></div><div class="field"><label class="req">报修详情</label><textarea name="detail" required placeholder="可描述问题故障的具体表现、产生原因、导致后果…"></textarea></div><div class="field"><label style="color:#263344">问题详情</label><table class="subtable"><thead><tr><th>供应商名称</th><th>损坏数量</th><th>损坏类型</th></tr></thead><tbody id="items"></tbody></table><button type="button" class="outline" onclick="addItem()">＋ 添加</button></div><div class="field"><label class="req">大区</label><select name="region" required><option value="">不要选错哦！</option>华东大区</option><option>华南大区</option><option>华北大区</option></select></div><div class="field"><label class="req">门店编号</label><input name="storeId" required placeholder="填完再确认下，别填错哦～"></div><div class="field"><label>门店名</label><input name="store" placeholder="—"></div><div class="field"><label>门店属性</label><input name="property" placeholder="—"></div><div class="field"><label class="req">联系人</label><input name="contact" required placeholder="最好在店，方便对接维修师傅"></div><div class="field"><label class="req">手机号码</label><input name="phone" type="tel" required pattern="1[3-9][0-9]{9}" placeholder="+86  请填写手机号码"></div><div class="field"><label>营业时间（可不填）</label><input name="hours" placeholder="请填写文本内容"></div></form></div><footer class="footer"><button onclick="saveDraft()" style="color:#8492a3;font-size:12px">▣<br>存草稿</button><button class="primary" onclick="saveForm()">保存 <small>（下一页提交审批）</small></button></footer></div><div id="chat" class="page"><header class="chathead"><span class="spark">✦</span><div><strong>AI 报修助手</strong><small>帮你整理，每一步由你确认</small></div><button class="textbtn" onclick="showPage('form');toast('已切回表单，AI 对话草稿已保留')">⇄ 传统表单</button></header><div class="context"><div id="context"></div><button class="textbtn" onclick="editBase()">修改</button></div><div id="messages" class="scroll chatbody" aria-live="polite"></div><div class="composer"><div class="composer-tools"><button onclick="upload('ai')">＋ 照片 / 视频</button><button onclick="voice()">♩ 模拟语音输入</button></div><div class="composer-row"><textarea id="input" aria-label="输入故障描述" placeholder="描述一下门店遇到的问题…"></textarea><button id="send" class="primary" onclick="send()">发送</button></div><div class="fineprint">AI 生成内容请核对 · 演示模式，不会创建真实工单</div></div></div><div id="toast" class="toast" role="status"></div></section></main><dialog id="modal"><div id="modalContent"></div></dialog><input id="file" type="file" accept="image/*,video/*" multiple hidden><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cats=['制冷设备 - 风幕柜/立式冷柜','制冷设备 - 卧式冰柜','暖通设备 - 门店空调','收银设备 - 收银机/扫码枪','照明设备 - 照明/招牌灯','物料质量 - 购物袋','水电设施 - 给排水','门店设施 - 货架/门锁','其他'];
const sample='店里的冷藏风幕柜不制冷了，柜内温度显示15度，估计是压缩机坏了，里面的鲜奶不敢卖只好全下架了。';
let base={region:'华东大区',store:'上海静安寺店',storeId:'SH0021',property:'商场店',address:'上海市静安区南京西路 1618 号 B1 层',hours:'10:00 - 22:00',contact:'张伟',phone:'13800001234'},ai={started:false,stage:'describe',category:'',detail:'',files:[],contactOK:false},formFiles=[],uploadTarget='ai',timer;
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('#toast').style.display='none',2800)}
function step(n){document.querySelectorAll('.step').forEach(e=>e.classList.toggle('active',+e.dataset.step===n))}function showPage(id){document.querySelectorAll('.page').forEach(e=>e.classList.toggle('visible',e.id===id));step(id==='form'?0:ai.stage==='done'?3:ai.stage==='review'?2:1)}
function context(){ $('#context').innerHTML='<strong>⌖ '+esc(base.store)+' · '+esc(base.storeId)+'</strong>'+esc(base.region)+' · '+esc(base.contact)+' '+esc(base.phone.replace(/(\d{3})\d{4}(\d{4})/,'$1****$2'))}context();
function msg(text,user=false){let e=document.createElement('div');e.className='msg'+(user?' user':'');e.innerHTML=(user?'':'<div class="avatar">✦</div>')+'<div class="bubble">'+text+'</div>';$('#messages').append(e);scrollChat();return e}function scrollChat(){requestAnimationFrame(()=>$('#messages').scrollTop=$('#messages').scrollHeight)}
function enterAI(){showPage('chat');if(ai.started)return;ai.started=true;$('#messages').innerHTML='<div class="date">今天 · 新的报修会话</div>';msg('<p>'+esc(base.contact)+'你好！门店信息已自动带出。</p><p>这次哪里出了问题？告诉我<strong>故障设备、具体表现、可能原因和影响</strong>，想到什么说什么。</p><small>也可以选择常见问题，再补充具体情况</small><div class="quickgrid">'+[['❄','冷柜 / 空调不制冷',0],['▣','收银机 / 扫码枪故障',3],['☀','照明 / 招牌灯不亮',4],['♧','购物袋 / 物料质量',5],['♒','水电 / 下水道堵塞',6],['⚒','货架 / 门锁损坏',7]].map(([i,t,n])=>'<button class="quick" onclick="quick('+n+')"><i>'+i+'</i>'+t+'</button>').join('')+'</div>');msg('<small>试试剧本中的报修描述</small><div class="actions"><button class="textbtn" onclick="useSample()">填入「风幕柜不制冷」示例 ↗</button></div>')}
function useSample(){if(ai.stage==='done')return;$('#input').value=sample;$('#input').focus()}function voice(){if(ai.stage==='done')return;$('#input').value=sample;toast('已模拟语音转文字，可修改后发送')}
function quick(n){if(ai.stage!=='describe'||ai.detail)return toast('当前问题已开始填写，可在确认单中修改类别');if(n===0){msg('冷柜 / 空调不制冷',true);msg('请选择具体设备，避免报修类别不准确。'+options([0,1,2]));ai.stage='category';return}ai.category=cats[n];msg(esc(cats[n]),true);msg('已选择<strong>'+esc(ai.category)+'</strong>。请描述具体表现、可能原因和影响；不清楚原因可以不填。');}
function options(indices){return '<div class="options">'+indices.map((n,i)=>'<button class="option" onclick="choose('+n+',this)">'+esc(cats[n])+(i===0&&ai.detail?'<small>根据描述推荐，请点选确认</small>':'')+'</button>').join('')+'</div>'}
function send(){let val=$('#input').value.trim();if(!val)return;if(ai.stage==='done')return toast('此报修单已提交，可重新演示');if(ai.stage==='category')return toast('请先点选报修类别');$('#input').value='';msg(esc(val),true);if(ai.stage==='review'){ai.detail+='\n补充说明：'+val;msg('已补充到报修详情，请核对最新确认单。');review();return}if(ai.detail){ai.detail+='\n补充说明：'+val;msg('已补充到报修详情。');return}ai.detail=val;if(val===sample)ai.detail='【故障表现】冷藏风幕柜不制冷，柜内温度显示 15℃。\n【产生原因】店员推测压缩机故障，待维修人员确认。\n【导致后果】柜内鲜奶已全部下架，无法正常销售。';if(ai.category){next();return}ai.stage='category';let inds=/冷|压缩/.test(val)?[0,1,2]:/收银|扫码/.test(val)?[3,8]:/灯|照明/.test(val)?[4,8]:/袋|物料/.test(val)?[5,8]:/水|堵/.test(val)?[6,8]:/货架|门锁/.test(val)?[7,8]:null;msg((inds?'已从描述中识别故障设备。请点选确认<strong>报修类别</strong>，防止误报被驳回。':'暂时无法准确匹配类别，请从以下类别选择，或选择「其他」。')+options(inds||cats.map((_,i)=>i)))}
function choose(n,button){if(ai.stage==='done')return;if(button){button.parentElement.querySelectorAll('button').forEach(b=>b.disabled=true);button.classList.add('selected')}ai.category=cats[n];msg('确认类别：'+esc(ai.category),true);if(!ai.detail){ai.stage='describe';msg('类别已登记。请描述问题的具体表现、可能原因和影响。');return}if(ai.stage==='review'){review();return}next()}
function next(){if(!ai.contactOK){ai.stage='contact';msg('类别已登记。联系人 / 手机号码将使用系统带出的本人信息：<strong>'+esc(base.contact)+'</strong>（+86 '+esc(base.phone)+'）。如替他人报修，可修改。<div class="actions"><button class="primary" onclick="confirmContact(this)">✓ 用本人信息</button><button class="outline" onclick="editBase(true)">修改联系人</button></div>');return}if(!ai.files.length){ai.stage='media';msg('还差问题照片或视频。请上传故障设备和问题部位，方便维修人员判断。'+(ai.category===cats[5]?'<p>购物袋还需拍摄袋子底部的供应商信息。</p>':'')+'<div class="actions"><button class="primary" onclick="upload(\'ai\')">＋ 上传照片 / 视频</button><button class="outline" onclick="demoAttachment()">使用演示附件</button></div>');return}review()}
function confirmContact(b){if(ai.stage==='done'||ai.contactOK)return;ai.contactOK=true;if(b)b.disabled=true;msg('使用联系人：'+esc(base.contact)+'（'+esc(base.phone)+'）',true);next()}
function upload(t){if(t==='ai'&&ai.stage==='done')return toast('已提交工单不可修改');uploadTarget=t;$('#file').click()}$('#file').onchange=()=>{let files=[...$('#file').files].filter(f=>/^(image|video)\//.test(f.type));if(!files.length)return toast('请选择图片或视频');let target=uploadTarget==='ai'?ai.files:formFiles;files.forEach(f=>target.push({name:f.name,url:URL.createObjectURL(f),type:f.type}));$('#file').value='';if(uploadTarget==='form'){renderFormFiles();return}msg('已添加 '+files.length+' 个附件',true);if(ai.stage==='media')next();else if(ai.stage==='review')review();else toast('附件已保留，继续描述问题即可')};
function demoAttachment(){if(ai.stage==='done')return;ai.files.push({name:'风幕柜故障现场（演示附件）',demo:true});msg('已添加：风幕柜故障现场（演示附件）',true);if(ai.stage==='review')review();else next()}
function fileList(files){return files.map(f=>'<div class="attachment">'+(f.url&&f.type.startsWith('image')?'<img src="'+f.url+'" style="width:64px;height:48px;object-fit:cover;border-radius:5px;vertical-align:middle;margin-right:8px">':'▧ ')+esc(f.name)+(f.url?' <a href="'+f.url+'" target="_blank">查看</a>':'')+'</div>').join('')}function renderFormFiles(){$('#formFiles').innerHTML=fileList(formFiles)}
function review(){ai.stage='review';step(2);document.querySelectorAll('.confirm .submit-ai').forEach(b=>b.disabled=true);let e=msg('<div class="confirm"><h3>报修预填确认单</h3><small>请核对后提交，点击字段可修改</small><div class="sectionlabel">基础信息 · 系统自动带出</div>'+[['大区','region'],['门店','store'],['门店编号','storeId'],['门店属性','property'],['门店地址','address'],['营业时间','hours'],['联系人','contact'],['手机号码','phone']].map(([l,k])=>'<div class="data-row"><span>'+l+'</span><button onclick="editBase()">'+esc(base[k]||'未填写')+' ›</button></div>').join('')+'<div class="sectionlabel">报修内容 · AI 整理</div><div class="data-row"><span>报修类别</span><button onclick="editCategory()">'+esc(ai.category)+' ›</button></div><div class="data-row"><span>报修详情</span><button onclick="editDetail()">编辑 ✎</button></div><div class="detail">'+esc(ai.detail)+'</div><div class="data-row"><span>照片 / 视频（'+ai.files.length+'）</span><button onclick="manageFiles()">修改附件 ›</button></div>'+fileList(ai.files)+'<small>演示单 · 待提交</small><button class="primary full submit-ai" style="margin-top:14px" onclick="submitAI(this)">确认并提交报修单</button></div>');scrollChat()}
function openModal(html){$('#modalContent').innerHTML=html;$('#modal').showModal()}function closeModal(){$('#modal').close()}
function editBase(contactOnly=false){if(ai.stage==='done')return toast('已提交工单不可修改');let fields=contactOnly?[['联系人','contact'],['手机号码','phone']]:[['大区','region'],['门店名称','store'],['门店编号','storeId'],['门店属性','property'],['门店地址','address'],['营业时间','hours'],['联系人','contact'],['手机号码','phone']];openModal('<h3>'+(contactOnly?'修改联系人':'修改基础信息')+'</h3><form id="baseForm">'+fields.map(([l,k])=>'<div class="field"><label>'+l+'</label><input name="'+k+'" value="'+esc(base[k])+'" '+(['hours','property','store'].includes(k)?'':'required')+(k==='phone'?' pattern="1[3-9][0-9]{9}" type="tel"':'')+'></div>').join('')+'<div class="actions"><button type="button" class="outline" onclick="closeModal()">取消</button><button class="primary">保存修改</button></div></form>');$('#baseForm').onsubmit=e=>{e.preventDefault();Object.assign(base,Object.fromEntries(new FormData(e.target)));context();closeModal();if(contactOnly&&!ai.contactOK)confirmContact();else if(ai.stage==='review')review();toast('基础信息已更新')}}
function editCategory(){if(ai.stage==='done')return;openModal('<h3>重新选择报修类别</h3><div class="options">'+cats.map((v,i)=>'<button class="option" onclick="ai.category=cats['+i+'];closeModal();review()">'+esc(v)+'</button>').join('')+'</div>')}
function editDetail(){if(ai.stage==='done')return;openModal('<h3>编辑报修详情</h3><form id="detailForm"><textarea name="detail" required style="height:210px">'+esc(ai.detail)+'</textarea><div class="actions"><button type="button" class="outline" onclick="closeModal()">取消</button><button class="primary">保存修改</button></div></form>');$('#detailForm').onsubmit=e=>{e.preventDefault();let v=e.target.detail.value.trim();if(!v)return;ai.detail=v;closeModal();review()}}
function manageFiles(){if(ai.stage==='done')return;openModal('<h3>问题照片或视频</h3>'+ai.files.map((f,i)=>'<div class="data-row"><div>'+esc(f.name)+'</div><button onclick="ai.files.splice('+i+',1);manageFilesRefresh()">删除</button></div>').join('')+'<div class="actions"><button class="outline" onclick="closeModal();upload(\'ai\')">添加附件</button><button class="primary" onclick="closeModal();review()">完成</button></div>')};function manageFilesRefresh(){closeModal();manageFiles()}
function submitAI(b){if(ai.stage==='done')return;if(!ai.files.length)return toast('请至少添加一张照片或一段视频');if(!ai.category||!ai.detail.trim()||!base.contact.trim()||!/^1[3-9][0-9]{9}$/.test(base.phone))return toast('请补全报修信息及有效手机号');ai.stage='done';b.disabled=true;step(3);$('#send').disabled=true;$('#input').disabled=true;msg('<div class="success"><div class="success-icon">✓</div><h3>报修提交成功</h3><small>模拟结果 · 未创建真实工单</small><div class="number">报修单编号<br><strong>BX-20261031-1032</strong></div><span class="pill" style="color:#279b70;background:#e9f7ef">已提交 / 待派单</span><p style="margin-top:14px">维修进度会通过通知推送给你。</p><button class="outline full" onclick="resetAI()">再报修一单</button></div>')}
function resetAI(){ai.files.forEach(f=>f.url&&URL.revokeObjectURL(f.url));ai={started:false,stage:'describe',category:'',detail:'',files:[],contactOK:false};$('#input').disabled=false;$('#send').disabled=false;$('#input').value='';enterAI()}
function unavailable(){openModal('<h3>AI 助手暂不可用</h3><p>请稍后再试，或使用传统表单继续报修。已有对话草稿会保留。</p><div class="actions"><button class="outline" onclick="closeModal()">稍后再试</button><button class="primary" onclick="closeModal();showPage(\'form\')">前往传统表单</button></div>')}
function demoMenu(){openModal('<h3>原型演示</h3><p>所有门店、联系人、附件示例及提交结果均为模拟数据。</p><div class="options"><button class="option" onclick="closeModal();resetAI()">重新演示 AI 对话</button><button class="option" onclick="closeModal();unavailable()">模拟 AI 服务不可用</button><button class="option" onclick="closeModal()">返回</button></div>')}
function addItem(){let row=document.createElement('tr');row.innerHTML='<td><input aria-label="供应商名称" placeholder="供应商"></td><td><input aria-label="损坏数量" type="number" min="1" placeholder="数量"></td><td><input aria-label="损坏类型" placeholder="类型"><button type="button" onclick="this.closest(\'tr\').remove()" style="color:#b26767">删除</button></td>';$('#items').append(row)}
function saveDraft(){try{localStorage.setItem('hotmaxx-form',JSON.stringify(Object.fromEntries(new FormData($('#traditional')))));toast('表单文字草稿已保存，附件仅保留在本次页面')}catch{toast('当前表单草稿已保留在页面中')}}function saveForm(){if(!$('#traditional').reportValidity())return;if(!formFiles.length)return toast('请上传问题照片或视频');saveDraft();openModal('<h3>报修记录已保存</h3><p>状态：待提交。请在下一步提交审批。</p><p class="hint">演示模式，不会保存到业务系统。</p><div class="actions"><button class="outline" onclick="closeModal()">返回编辑</button><button class="primary" onclick="closeModal();toast(\'模拟审批提交成功\')">提交审批</button></div>')}
$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});try{let draft=JSON.parse(localStorage.getItem('hotmaxx-form')||'null');if(draft)Object.entries(draft).forEach(([k,v])=>{if($('#traditional').elements[k])$('#traditional').elements[k].value=v})}catch{}
</script></body></html>
